  {title:'For agents', items:[['connect','Connect an agent','plug'],['audit','Audit log','audit']]}
];
function shell(active, content, ctx){
  const navDef = ctx ? ctx.nav : NAV;
  const nav = navDef.map(g=>`<div class="navgroup"><h3>${g.title}</h3>${g.items.map(([id,label,icon,count,warn])=>`<a class="navlink" href="#${id}" ${active===id?'aria-current="page"':''}>${ic(icon)}<span class="t">${label}</span>${count?`<span class="count ${warn&&warn()?'warn':''}">${count()}</span>`:''}</a>`).join('')}</div>`).join('');
  const brand = ctx ? `<a class="brand" href="#run-${ctx.id}">${esc(ctx.name)}<small>/ app</small></a>` : '<a class="brand" href="#overview">openapps<small>/ admin</small></a>';
  const crumbs = (ctx?.crumbs || CRUMBS).map((c,i,a)=> i===a.length-1 ? `<span class="cur">${esc(c[0])}</span>` : `<a href="${c[1]}">${esc(c[0])}</a><span class="x">/</span>`).join('');
  return `<div class="app">
  <aside class="side" aria-label="Sidebar">
    ${brand}
    <button class="searchbtn" data-act="palette" aria-haspopup="dialog" aria-keyshortcuts="Meta+K Control+K">${ic('search')}<span>Search or jump to…</span><kbd>⌘K</kbd></button>
    <nav aria-label="Main navigation" style="display:flex;flex-direction:column;gap:var(--oa-space-6)">${nav}</nav>
    <button class="me" data-act="user" aria-haspopup="menu"><span class="avatar">${S.user.initials}</span><span class="who"><span class="n">${esc(S.user.name)}</span><span class="e">${esc(S.user.email)}</span></span></button>
  </aside>
  <div class="col">
    <header class="top">
      <button class="iconbtn menu-toggle" data-act="nav" aria-label="Open navigation">${ic('menu')}</button>
      <span class="mbrand">${brand}</span>
      <nav class="crumbs label" aria-label="Breadcrumb">${crumbs}</nav>
      <div class="tools">
        <button class="iconbtn" data-act="palette" aria-label="Search">${ic('search')}</button>
        <button class="iconbtn hide-sm" data-act="switcher" aria-label="Switch app">${ic('apps')}</button>
        <button class="iconbtn hide-sm" data-act="theme" aria-label="Toggle light and dark">${ic(isDark()?'sun':'moon')}</button>
        <button class="iconbtn" data-act="notes" aria-label="Notifications, ${S.notes.length} unread">${ic('bell')}${S.notes.length?'<span class="dot"></span>':''}</button>
      </div>
    </header>
    <main id="main" tabindex="-1"><div class="page">${content}</div></main>
  </div></div>`;
}
let CRUMBS = [];
const isDark = () => { const d=document.documentElement.dataset.theme; return d ? d==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; };

/* ---------- Seiten der Control Plane ---------- */
function pageOverview(){
  CRUMBS=[['Platform','#overview'],['Overview']];
  const live=S.apps.filter(a=>a.status==='live'||a.status==='degraded').length;
  const findings=S.apps.filter(a=>a.status==='degraded').length;
  const active=S.agents.filter(a=>!a.disabled).length;
  const denied=S.audit.filter(e=>e.out==='denied').length;
  const loading=listState==='loading';
  const stat=(k,v,h,tone,href)=>`<a class="stat" href="${href}"><span class="k">${k}</span>${loading?'<span class="sk big"></span>':`<span class="v">${v}</span><span class="h ${tone}">${h}</span>`}</a>`;
  const attention = [
    ...S.apps.filter(a=>a.status==='degraded').map(a=>({sev:'warning', t:`${a.name} is running with a finding`, s:'Post-deploy lint: host port published, app reachable around the gateway', href:`#app-${a.id}`})),
    ...S.apps.flatMap(a=>a.deploys.filter(d=>d.status==='blocked').map(d=>({sev:'danger', t:`${a.name} ${d.v} was blocked`, s:`Review gate: ${d.gate}`, href:`#app-${a.id}`}))),
    ...S.apps.filter(a=>a.status==='new').map(a=>({sev:'', t:`${a.name} has never been deployed`, s:'Created, waiting for the first green review gate', href:`#app-${a.id}`}))
  ];
  const att = listState==='error' ? ERR('Overview could not be loaded') : loading ? `<div class="list">${[1,2,3].map(()=>'<div class="row"><div class="body"><span class="sk w2"></span><span class="sk w1" style="margin-top:6px"></span></div></div>').join('')}</div>`
    : (listState==='empty'||!attention.length) ? EMPTY('All clear','Nothing needs your attention. Findings and blocked deployments show up here.')
    : `<div class="list">${attention.map(a=>`<a class="row" href="${a.href}"><span class="sev ${a.sev}" aria-hidden="true"></span><div class="body"><div class="t1">${esc(a.t)}</div><div class="t2">${esc(a.s)}</div></div><span class="go">${ic('chev')}</span></a>`).join('')}</div>`;
  const feed = listState==='error' ? '' : loading ? `<div class="list feed">${[1,2,3,4].map(()=>'<div class="row"><span class="sk w3"></span></div>').join('')}</div>`
    : (listState==='empty'||!S.audit.length) ? EMPTY('No activity yet','Every call through the API and MCP lands in the audit log.')
    : `<div class="list feed">${S.audit.slice(0,6).map(e=>`<div class="row"><span class="t">${esc(e.at)}</span><div class="body"><div class="what"><b>${esc(e.what)}</b></div><div class="t2 ellip" title="${esc(e.on)} · ${esc(e.who)}">${esc(e.on)} · ${esc(e.who)}</div></div>${e.out==='allowed'?'<span class="badge success">allowed</span>':'<span class="badge danger">denied</span>'}</div>`).join('')}</div>`;
  return head({eyebrow:'Platform', title:'Overview', text:'What runs on this instance, what needs you, and what agents did recently.', actions:btn(`${ic('grants')} Grant access`,'new-grant')+btn(`${ic('plus')} Create app`,'new-app','primary')})+
  `<div class="stats">${stat('Apps live',live,findings?`${findings} with findings`:'all healthy',findings?'warning':'success','#apps')}${stat('Grants',S.grants.length,'default deny everywhere else','','#grants')}${stat('Agents active',active,`${S.agents.length-active} disabled`,'','#agents')}${stat('Denied calls · 24h',denied,denied?'see audit log':'none','danger','#audit')}</div>
  <div class="two"><section class="section"><h2 class="section-h">Needs attention</h2>${att}</section><section class="section"><h2 class="section-h"><a href="#audit">View all →</a>Recent activity</h2>${feed}</section></div>`;
}

  dataTable('apps',{label:'Apps', noun:'apps', items:S.apps, text:a=>`${a.name} ${a.id} ${a.version||''} ${a.by||''}`,

    row:a=>`<tr class="link" data-href="#app-${a.id}" tabindex="0"><td><div class="title">${esc(a.name)}</div><div class="sub mono">apps.example.com/${esc(a.id)}</div></td><td>${badge(a.status)}</td><td class="hide-sm mono">${a.version?esc(a.version)+' <span class="subtle">· '+esc(a.sha)+'</span>':'<span class="subtle">—</span>'}</td><td class="hide-sm">${a.deployedAt?esc(a.deployedAt)+'<div class="sub">'+esc(a.by)+'</div>':'<span class="subtle">—</span>'}</td><td class="hide-sm num right">${a.tools.length}</td><td class="act">${a.status==='new'?'':`<a class="btn sm" href="#run-${a.id}">Open ${ic('arrow')}</a>`}</td></tr>`,
    emptyTitle:'No apps yet', emptyText:'Create an app from the starter template, or let your agent do it with create_app.', emptyAction:btn('Create app','new-app','primary'), errorTitle:'Apps could not be loaded'});

function gateRows(state){
  const steps=[['gitleaks','No secrets in the code','blocks'],['semgrep','Security rules (p/owasp-top-ten)','blocks'],['ui-lint','Only components and tokens from @openapps/ui','blocks'],['manifest','app.json matches code, tables and tools','blocks'],['gateway-config','Router with forward auth, no host port, no second network','blocks'],['ai-review','Report from a frontier model, own key','advisory']];
  return steps.map(([name,what,kind],i)=>{
    const st=state[i]||'wait';
    const mark={ok:'<span class="mark ok" aria-label="passed">✓</span>',fail:'<span class="mark fail" aria-label="failed">!</span>',info:'<span class="mark info" aria-label="note">i</span>',run:'<span class="mark run" aria-label="running"></span>',wait:'<span class="mark" aria-label="waiting">·</span>'}[st];
    return `<div class="row">${mark}<div><div class="what">${name}</div><div class="why">${what}</div></div>${kind==='advisory'?'<span class="badge primary plain">advisory</span>':'<span class="badge plain">blocks</span>'}</div>`;
  }).join('');
}
function appGrants(a){ return S.grants.filter(g=>g.resource===`app:${a.id}`||g.resource.startsWith(`tool:${a.id}.`)||g.resource.startsWith(`table:${a.id}.`)); }

function pageApp(id){
  const a=S.apps.find(x=>x.id===id); if(!a) return pageApps();
  CRUMBS=[['Platform','#overview'],['Apps','#apps'],[a.name]];
  const tab=S.appTab;
  const tabs=[['overview','Overview'],['deploys','Deployments',a.deploys.length],['access','Access',appGrants(a).length],['tools','Tools',a.tools.length]].map(([k,l,n])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}${n!==undefined?`<span class="n">${n}</span>`:''}</button>`).join('');
  let body='';
  if(tab==='overview'){
    const props=`<aside class="props" aria-label="Properties"><h2 class="label">Properties</h2><dl>
      <div class="p"><dt>Status</dt><dd>${badge(a.status)}</dd></div>
      <div class="p"><dt>Version</dt><dd class="mono">${esc(a.version||'—')}${a.sha?` <span class="subtle">· ${esc(a.sha)}</span>`:''}</dd></div>
      <div class="p"><dt>Deployed</dt><dd>${esc(a.deployedAt||'—')}${a.by?`<div class="subtle" style="font-size:var(--oa-text-xs)">${esc(a.by)}</div>`:''}</dd></div>
      <div class="p"><dt>Address</dt><dd class="mono">apps.example.com/${esc(a.id)}</dd></div>
      <div class="p"><dt>Schema and role</dt><dd class="mono">${esc(a.schema)}</dd></div>
      <div class="p"><dt>Tables</dt><dd class="mono">${a.tables.map(esc).join(', ')}</dd></div>
      <div class="p"><dt>Privileges</dt><dd>no SUPERUSER, no BYPASSRLS</dd></div>
      <div class="p"><dt>Without a grant</dt><dd class="mono">403</dd></div></dl></aside>`;
    body=`<div class="two detail"><div style="display:flex;flex-direction:column;gap:var(--oa-space-8);min-width:0">
      ${a.status==='degraded'?`<div class="callout" role="status"><div><strong>Running with a finding.</strong> The post-deploy lint found a published host port, so the app is reachable around the gateway. Roll back, or deploy a commit without <span class="mono">ports:</span>.</div>${btn('Roll back','rollback','sm','data-i="1"')}</div>`:''}
      <section class="section"><h2 class="section-h">Review gate of the running version</h2>${a.version?`<div class="gate">${gateRows(['ok','ok','ok','ok',a.status==='degraded'?'fail':'ok','info'])}</div>`:EMPTY('Not deployed yet','The gate runs on the first request_deploy.', btn('Request deploy','deploy','primary'))}</section>
      ${a.deploys.length?`<section class="section"><h2 class="section-h"><a href="#" data-tab="deploys">All deployments →</a>Recent deployments</h2><div class="list">${a.deploys.slice(0,3).map(d=>`<div class="row"><span class="sev ${d.status==='live'?'ok':d.status==='blocked'?'danger':d.status==='degraded'?'warning':''}" aria-hidden="true"></span><div class="body"><div class="t1 mono">${esc(d.v)} <span class="subtle">· ${esc(d.sha)}</span></div><div class="t2">${esc(d.at)} · ${esc(d.by)} · ${esc(d.gate)}</div></div>${badge(d.status)}</div>`).join('')}</div></section>`:''}
    </div>${props}</div>`;
  } else if(tab==='deploys'){
    body=dataTable('deploys-'+a.id,{label:'Deployments', noun:'deployments', items:a.deploys, text:d=>`${d.v} ${d.sha} ${d.by} ${d.gate}`,
      cols:[{key:'v',label:'Version'},{key:'s',label:'Status'},{key:'g',label:'Review gate',cls:'hide-sm'},{key:'w',label:'When, who',cls:'hide-sm'},{key:'x',label:'<span class="sr">Actions</span>'}],
      row:d=>`<tr><td class="mono">${esc(d.v)}<div class="sub">${esc(d.sha)}</div></td><td>${badge(d.status)}</td><td class="hide-sm">${esc(d.gate)}</td><td class="hide-sm">${esc(d.at)}<div class="sub">${esc(d.by)}</div></td><td class="act">${d.status==='replaced'?btn('Roll back','rollback','sm',`data-i="${a.deploys.indexOf(d)}"`):''}</td></tr>`,
      emptyTitle:'No deployments yet', emptyText:'Push a commit and run request_deploy, here or over MCP.', emptyAction:btn('Request deploy','deploy','primary'), errorTitle:'Deployments could not be loaded'});
  } else if(tab==='access'){
    body=`<p class="muted" style="margin:0">Who may open this app, read its data or run its tools. Without a grant: nothing, admins included.</p>`+grantsTable('grants-'+a.id, appGrants(a), `${btn(`${ic('plus')} Grant access`,'new-grant','sm',`data-res="app:${a.id}"`)}`);
  } else {
    body=dataTable('tools-'+a.id,{label:'Tools', noun:'tools', items:a.tools, text:t=>t,
      cols:[{key:'t',label:'Tool'},{key:'a',label:'Action',cls:'hide-sm'},{key:'s',label:'Status'}],
      row:t=>`<tr><td class="mono">${esc(a.id)}.${esc(t)}</td><td class="hide-sm">${esc(t.split('.').pop().replace('_',' '))}</td><td>${S.grants.some(g=>g.resource===`tool:${a.id}.${t}`||g.resource===`tool:${a.id}.${t.split('.')[0]}.*`)?'<span class="badge success">granted</span>':'<span class="badge plain">locked</span>'}</td></tr>`,
      emptyTitle:'No tools', emptyText:'Tools are generated from the app’s OpenAPI spec.', errorTitle:'Tools could not be loaded'});
  }
  return head({title:`${esc(a.name)} ${badge(a.status)}`, text:`apps.example.com/${esc(a.id)} · schema ${esc(a.schema)}`, actions:(a.status==='new'?'<button class="btn" disabled title="Not deployed yet">Open app</button>':`<a class="btn" href="#run-${a.id}">Open app ${ic('arrow')}</a>`)+btn('Request deploy','deploy','primary')})+
    `<div class="tabs" role="tablist" aria-label="App sections">${tabs}</div>${body}`;
}

function grantsTable(id, items, extra){
  return dataTable(id,{label:'Grants', noun:'grants', items, extra, text:g=>`${g.subject} ${g.verb} ${g.resource} ${g.by}`,
    filters:[['all','All'],['read','Read'],['write','Write'],['execute','Execute']], filter:(g,f)=>g.verb===f,
    cols:[{key:'s',label:'Who',sort:g=>g.subject},{key:'v',label:'Can',sort:g=>g.verb},{key:'r',label:'On',sort:g=>g.resource},{key:'a',label:'Since',cls:'hide-sm'},{key:'x',label:'<span class="sr">Actions</span>'}],
    row:g=>`<tr><td class="mono"><span class="ellip" title="${esc(g.subject)}">${esc(g.subject)}</span></td><td>${verbBadge(g.verb)}</td><td class="mono"><span class="ellip" title="${esc(g.resource)}">${esc(g.resource)}</span></td><td class="hide-sm">${esc(g.at)}<div class="sub">${esc(g.by)}</div></td><td class="act">${g.by==='system:bootstrap'?'<span class="sub" title="Created at bootstrap, cannot be revoked here">system</span>':btn('Revoke','revoke','sm ghost dangerous',`data-id="${g.id}"`)}</td></tr>`,
    emptyTitle:'No grants', emptyText:'Without a grant nobody may do anything: not people, not apps, not agents.', emptyAction:btn('Grant access','new-grant','primary'), errorTitle:'Grants could not be loaded'});
}

/* ---------- Die Apps selbst ---------- */
const OFFER = {draft:['plain','draft'], sent:['primary','sent'], accepted:['success','accepted'], declined:['danger','declined']};
const PROJ = {active:['primary','active'], paused:['warning','paused'], done:['success','done']};
const tone = (map,k) => { const [t,l]=map[k]||['plain',k]; return `<span class="badge ${t}">${esc(l)}</span>`; };
const toolNote = t => `<p class="toolnote">Also available as the tool <span class="mono">${esc(t)}</span>, for agents with a grant.</p>`;
const appNote = id => `<div class="callout info"><div>You see this app the way someone in the group <b>${id==='quotes'?'sales':'everyone'}</b> sees it. Sign-in and permissions come from the platform; the app itself has no auth code.</div></div>`;

function runProjects(sub){
  const ctx={id:'projects', name:'Projects', nav:[{title:'Projects', items:[['run-projects','All projects','book',()=>S.projects.length]]},{title:'Platform', items:[['overview','Control plane','home']]}]};
  if(sub){ const p=S.projects.find(x=>x.id===sub); if(p){
    ctx.crumbs=[['Projects','#run-projects'],[p.name]];
    const done=p.ms.filter(m=>m[2]).length;
    return shell('run-projects', head({title:`${esc(p.name)} ${tone(PROJ,p.status)}`, text:esc(p.client), actions:btn(p.status==='done'?'Reopen':'Mark as done','proj-status','',`data-id="${p.id}"`)})+
    `<div class="two detail"><section class="section"><h2 class="section-h">Milestones</h2>
      ${p.ms.length?`<div class="checklist">${p.ms.map((m,i)=>`<label for="ms-${p.id}-${i}"><input type="checkbox" id="ms-${p.id}-${i}" data-ms="${i}" data-p="${p.id}" ${m[2]?'checked':''}><span class="${m[2]?'done':''}">${esc(m[0])}</span><span class="due">${esc(m[1])}</span></label>`).join('')}</div>`:EMPTY('No milestones yet','Add the first one so progress becomes visible.')}
      <div class="actions">${btn(`${ic('plus')} Add milestone`,'add-ms','sm',`data-id="${p.id}"`)}</div>${toolNote('projects.projects.update')}</section>
      <aside class="props" aria-label="Properties"><h2 class="label">Properties</h2><dl>
        <div class="p"><dt>Progress</dt><dd><div class="progress"><div class="bar"><span style="width:${p.ms.length?Math.round(done/p.ms.length*100):0}%"></span></div><span class="num">${done} / ${p.ms.length}</span></div></dd></div>
        <div class="p"><dt>Client</dt><dd>${esc(p.client)}</dd></div><div class="p"><dt>Owner</dt><dd>${esc(p.owner)}</dd></div><div class="p"><dt>Due</dt><dd>${esc(p.due)}</dd></div></dl></aside></div>`, ctx);
  }}
  ctx.crumbs=[['Projects','#run-projects'],['All projects']];
  return shell('run-projects', head({eyebrow:'Projects', title:'All projects', text:'Running and finished client projects, with milestones.', actions:btn(`${ic('plus')} New project`,'new-project','primary')})+appNote('projects')+
    dataTable('projects',{label:'Projects', noun:'projects', items:S.projects, text:p=>`${p.name} ${p.client} ${p.owner}`,
      filters:[['all','All'],['active','Active'],['paused','Paused'],['done','Done']], filter:(p,f)=>p.status===f,
      cols:[{key:'n',label:'Project',sort:p=>p.name},{key:'s',label:'Status',sort:p=>p.status},{key:'m',label:'Milestones',cls:'hide-sm'},{key:'o',label:'Owner',cls:'hide-sm',sort:p=>p.owner},{key:'d',label:'Due',cls:'hide-sm'}],
      row:p=>{ const d=p.ms.filter(m=>m[2]).length; return `<tr class="link" data-href="#run-projects-${p.id}" tabindex="0"><td><div class="title">${esc(p.name)}</div><div class="sub">${esc(p.client)}</div></td><td>${tone(PROJ,p.status)}</td><td class="hide-sm"><div class="progress"><div class="bar"><span style="width:${p.ms.length?Math.round(d/p.ms.length*100):0}%"></span></div><span class="num">${d}/${p.ms.length}</span></div></td><td class="hide-sm">${esc(p.owner)}</td><td class="hide-sm num">${esc(p.due)}</td></tr>`; },
      emptyTitle:'No projects yet', emptyText:'Create the first project. Milestones come after.', emptyAction:btn('New project','new-project','primary'), errorTitle:'Projects could not be loaded'})+
    toolNote('projects.projects.list'), ctx);
}

function runQuotes(sub){
  const ctx={id:'quotes', name:'Quotes', nav:[{title:'Quotes', items:[['run-quotes','All quotes','audit',()=>S.offers.length]]},{title:'Platform', items:[['overview','Control plane','home']]}]};
  if(sub){ const o=S.offers.find(x=>x.id===sub); if(o){
    ctx.crumbs=[['Quotes','#run-quotes'],[o.no]];
    const n=net(o), vat=Math.round(n*19)/100;
    const acts = o.status==='draft' ? btn('Prepare email draft','offer-draft','',`data-id="${o.id}"`)+btn('Mark as sent','offer-set','primary',`data-s="sent" data-id="${o.id}"`)
      : o.status==='sent' ? btn('Declined','offer-set','',`data-s="declined" data-id="${o.id}"`)+btn('Accepted','offer-set','primary',`data-s="accepted" data-id="${o.id}"`) : '';
    return shell('run-quotes', head({title:`${esc(o.no)} ${tone(OFFER,o.status)}`, text:esc(o.client), actions:acts})+
    `<div class="two detail"><section class="section"><h2 class="section-h">Line items</h2>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>Item</th><th class="right">Qty</th><th class="hide-sm">Unit</th><th class="right hide-sm">Unit price</th><th class="right">Total</th></tr></thead><tbody>${o.items.map(([t,q,u,pr],i)=>`<tr><td class="num subtle">${i+1}</td><td>${esc(t)}</td><td class="num right">${q}</td><td class="hide-sm">${esc(u)}</td><td class="num right hide-sm">${eur(pr)}</td><td class="num right">${eur(q*pr)}</td></tr>`).join('')}</tbody></table></div>
      <dl class="totals"><dt>Net</dt><dd>${eur(n)}</dd><dt>VAT 19 %</dt><dd>${eur(vat)}</dd><dt class="sum">Gross</dt><dd class="sum">${eur(n+vat)}</dd></dl>
      ${o.status==='draft'?toolNote('quotes.quotes.send_draft')+'<p class="toolnote">The draft lands in the person’s mailbox and is sent from there by hand.</p>':''}</section>
      <aside class="props" aria-label="Properties"><h2 class="label">Properties</h2><dl>
        <div class="p"><dt>Client</dt><dd>${esc(o.client)}</dd></div><div class="p"><dt>Contact</dt><dd class="mono">${esc(o.contact)}</dd></div>
        <div class="p"><dt>Date</dt><dd>${esc(o.date)}</dd></div><div class="p"><dt>Valid until</dt><dd>${esc(o.valid)}</dd></div><div class="p"><dt>Net</dt><dd class="num">${eur(n)}</dd></div></dl></aside></div>`, ctx);
  }}
  ctx.crumbs=[['Quotes','#run-quotes'],['All quotes']];
  const open=S.offers.filter(o=>o.status==='sent').reduce((s,o)=>s+net(o),0), won=S.offers.filter(o=>o.status==='accepted').reduce((s,o)=>s+net(o),0);
  const loading=listState==='loading';

  return shell('run-quotes', head({eyebrow:'Quotes', title:'All quotes', text:'Sales quotes from draft to signature. Amounts are net.', actions:btn(`${ic('plus')} New quote`,'new-offer','primary')})+appNote('quotes')+
    (listState==='data'||loading?`<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr))">${stat('Open · sent',eur(open),`${S.offers.filter(o=>o.status==='sent').length} quotes`)}${stat('Accepted',eur(won),'this quarter')}${stat('Drafts',S.offers.filter(o=>o.status==='draft').length,'not sent yet')}</div>`:'')+
    dataTable('quotes',{label:'Quotes', noun:'quotes', items:S.offers, text:o=>`${o.no} ${o.client} ${o.contact}`,
      filters:[['all','All'],['draft','Draft'],['sent','Sent'],['accepted','Accepted']], filter:(o,f)=>o.status===f,
      cols:[{key:'no',label:'Number',sort:o=>o.no},{key:'c',label:'Client',sort:o=>o.client},{key:'s',label:'Status',sort:o=>o.status},{key:'n',label:'Net',right:1,cls:'right',sort:o=>net(o)},{key:'v',label:'Valid until',cls:'hide-sm'}],
      row:o=>`<tr class="link" data-href="#run-quotes-${o.id}" tabindex="0"><td><div class="title mono">${esc(o.no)}</div><div class="sub">${esc(o.date)}</div></td><td>${esc(o.client)}</td><td>${tone(OFFER,o.status)}</td><td class="num right">${eur(net(o))}</td><td class="hide-sm num">${esc(o.valid)}</td></tr>`,
      emptyTitle:'No quotes yet', emptyText:'Create a quote. It starts as a draft and only goes out when you send it.', emptyAction:btn('New quote','new-offer','primary'), errorTitle:'Quotes could not be loaded'})+
    toolNote('quotes.quotes.list'), ctx);
}

/* ---------- Dialoge ---------- */
const dlg = $('#dlg');
const cancelBtn = '<button class="btn" value="cancel" formnovalidate>Cancel</button>';
function openDialog(html, onSubmit, cls=''){
  dlg.className=cls; dlg.innerHTML=`<form method="dialog" novalidate>${html}</form>`;
  const f=$('form',dlg);
  f.addEventListener('submit', e=>{ e.preventDefault(); const b=e.submitter; if(b && b.value==='cancel'){ dlg.close(); return; } if(onSubmit(f)!==false) dlg.close(); });
  dlg.showModal(); const first=$('input,select',dlg) || $('[value="cancel"]',dlg); if(first) first.focus();
}
function confirmDialog({title, text, confirm}, onYes){
  openDialog(`<h2>${title}</h2><p>${text}</p><div class="dialog-actions">${cancelBtn}<button class="btn danger" value="ok">${confirm}</button></div>`, ()=>{ onYes(); }, 'sm');
}
function fieldErr(f, inputSel, errSel, msg){ const e=$(errSel,f); e.textContent=msg; e.hidden=false; const i=$(inputSel,f); i.setAttribute('aria-invalid','true'); i.focus(); return false; }
function rand(n){ const c='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_'; let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
const audit = (what,on,out='allowed') => S.audit.unshift({at:'now', who:S.user.email, what, on, out});

function dlgNewAgent(){
  openDialog(`<h2>Create agent</h2><p>The agent gets its own identity. It may do nothing until you grant it something.</p>
    <div class="field"><label for="ag-name">Handle</label><input class="input mono" id="ag-name" placeholder="claude-lena" autocomplete="off" aria-describedby="ag-hint"><span class="hint" id="ag-hint">Lower case, digits and hyphens. Appears in grants as agent:&lt;handle&gt;.</span><span class="err" id="ag-err" hidden></span></div>
    <div class="field"><label for="ag-display">Display name</label><input class="input" id="ag-display" placeholder="Claude Code (Lena)"></div>
    <div class="dialog-actions">${cancelBtn}<button class="btn primary" value="ok">Create agent</button></div>`, f=>{
      const n=$('#ag-name',f).value.trim(), d=$('#ag-display',f).value.trim()||n;
      if(!/^[a-z][a-z0-9-]{1,62}$/.test(n)) return fieldErr(f,'#ag-name','#ag-err','Start with a lower-case letter, at least two characters, only a–z, 0–9 and hyphens.');
      if(S.agents.some(a=>a.name===n)) return fieldErr(f,'#ag-name','#ag-err','This handle is taken.');
      S.agents.unshift({name:n, display:d, owner:S.user.email, seen:'never', ord:0, disabled:false}); audit('create_agent','agent:'+n);
      setTimeout(()=>dlgToken(n),0); render();
    });
}
function dlgToken(n){
  const tok='oac_'+rand(16)+'.'+rand(43);
  openDialog(`<h2>Token for agent:${esc(n)}</h2><p>This token is shown only now. Only its hash is stored; if you lose it, create the agent again.</p>
    <div class="secret"><code id="tok">${tok}</code><button class="btn" type="button" id="copy">${ic('copy')} Copy</button></div>
    <div class="callout"><div>Sample value from the prototype, not usable. A real token belongs in your MCP client’s config only, never in a chat or a repo.</div></div>
    <div class="dialog-actions"><a class="btn" href="#grants" id="to-grants">Grant access</a><button class="btn primary" value="ok">Done</button></div>`, ()=>true);
  $('#copy',dlg).addEventListener('click',()=>copy(tok));
  $('#to-grants',dlg).addEventListener('click',()=>dlg.close());
}
function copy(text){ navigator.clipboard?.writeText(text).then(()=>toast('Copied to clipboard'),()=>toast('Copy failed, select the text instead')); }
function dlgNewGrant(res){
  const subjects=[...S.groups.map(g=>'group:'+g.name), ...S.agents.filter(a=>!a.disabled).map(a=>'agent:'+a.name), ...S.apps.map(a=>'app:'+a.id)];
  const resources=[...S.apps.map(a=>'app:'+a.id), ...S.apps.flatMap(a=>a.tables.map(t=>`table:${a.id}.${t}`)), ...S.apps.flatMap(a=>a.tools.map(t=>`tool:${a.id}.${t}`)), 'group:*', 'agent:*'];
  openDialog(`<h2>Grant access</h2><p>Takes effect on the next call. You can revoke it at any time.</p>
    <div class="field"><label for="gr-s">Who</label><select class="select mono" id="gr-s">${subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>
    <div class="field"><label for="gr-v">Can</label><select class="select" id="gr-v"><option value="read">read</option><option value="write">write</option><option value="execute">execute</option></select></div>
    <div class="field"><label for="gr-r">On</label><select class="select mono" id="gr-r">${resources.map(r=>`<option ${r===res?'selected':''}>${esc(r)}</option>`).join('')}</select></div>
    <div class="dialog-actions">${cancelBtn}<button class="btn primary" value="ok">Grant</button></div>`, f=>{
      const g={id:S.nextGrant++, subject:$('#gr-s',f).value, verb:$('#gr-v',f).value, resource:$('#gr-r',f).value, by:S.user.email, at:'today'};
      if(S.grants.some(x=>x.subject===g.subject&&x.verb===g.verb&&x.resource===g.resource)){ toast('This grant already exists'); return; }
      S.grants.unshift(g); audit('grant',g.resource); render(); toast(`Granted: ${g.subject} can ${g.verb} ${g.resource}`);
    });
}
function dlgNewGroup(){
  openDialog(`<h2>Create group</h2>
    <div class="field"><label for="gp-n">Name</label><input class="input mono" id="gp-n" placeholder="marketing"><span class="hint">Lower case and hyphens. Travels in the X-Auth-Groups header, so no commas.</span><span class="err" id="gp-err" hidden></span></div>
    <div class="field"><label for="gp-d">Description</label><input class="input" id="gp-d" placeholder="Marketing team"></div>
    <div class="dialog-actions">${cancelBtn}<button class="btn primary" value="ok">Create group</button></div>`, f=>{
      const n=$('#gp-n',f).value.trim();
      if(!/^[a-z][a-z0-9-]*[a-z0-9]$/.test(n)||n.length<3) return fieldErr(f,'#gp-n','#gp-err','At least three characters, only a–z, 0–9 and hyphens, not at the edges.');
      if(S.groups.some(g=>g.name===n)) return fieldErr(f,'#gp-n','#gp-err','This group already exists.');
      S.groups.push({name:n, desc:$('#gp-d',f).value.trim(), members:[]}); audit('create_group','group:'+n); render(); toast('Group created: '+n);

function dlgAddMember(g){
  openDialog(`<h2>Add to ${esc(g)}</h2><p>The person gets the group’s rights on their next call.</p>
    <div class="field"><label for="mb-e">Email</label><input class="input" id="mb-e" type="email" placeholder="name@example.com"><span class="err" id="mb-err" hidden></span></div>
    <div class="dialog-actions">${cancelBtn}<button class="btn primary" value="ok">Add person</button></div>`, f=>{
      const e=$('#mb-e',f).value.trim().toLowerCase();
      if(!/^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/.test(e)) return fieldErr(f,'#mb-e','#mb-err','Enter an email address without commas.');
      if(!e.endsWith('@example.com')) return fieldErr(f,'#mb-e','#mb-err','Only example.com addresses can sign in (AUTH_ALLOWED_EMAIL_DOMAINS).');
      const grp=S.groups.find(x=>x.name===g); if(!grp.members.includes(e)) grp.members.push(e); audit('grant_group_member','group:'+g); render(); toast(`${e} is now in ${g}`);

function dlgNewApp(){

    <div class="field"><label for="ap-n">Name</label><input class="input mono" id="ap-n" placeholder="expenses"><span class="hint">Becomes the path apps.example.com/&lt;name&gt; and the schema app_&lt;name&gt;.</span><span class="err" id="ap-err" hidden></span></div>

function dlgDeploy(a){
  const ver=a.version ? a.version.replace(/(\d+)$/, m=>String(+m+1)) : 'v0.1.0';
  openDialog(`<h2>Request deploy: ${esc(a.name)}</h2><p>The control plane fetches the commit from GitHub itself and checks it. No local path needed.</p>
    <div class="field-row"><div class="field"><label for="dp-v">Version</label><input class="input mono" id="dp-v" value="${ver}"></div>
    <div class="field"><label for="dp-s">Commit</label><input class="input mono" id="dp-s" value="${rand(7).toLowerCase().replace(/[^a-f0-9]/g,'e')}"></div></div>
    <div class="field"><label for="dp-x">Outcome in the prototype</label><select class="select" id="dp-x"><option value="ok">Gate passes, gets deployed</option><option value="secret">gitleaks finds a secret</option></select><span class="hint">Prototype only, to see both paths.</span></div>
    <div class="gate" id="dp-gate">${gateRows([])}</div>
    <div class="dialog-actions">${cancelBtn}<button class="btn primary" value="ok" id="dp-go">Check and deploy</button></div>`, f=>{
      const go=$('#dp-go',f); if(go.dataset.done) return true;
      go.disabled=true; go.textContent='Checking…'; const fail=$('#dp-x',f).value==='secret';
      const v=$('#dp-v',f).value.trim(), sha=$('#dp-s',f).value.trim(); const st=[]; let i=0;
      const tick=()=>{
        if(i>0) st[i-1]=(fail&&i-1===0)?'fail':(i-1===5?'info':'ok');
        if(fail&&i===1){ $('#dp-gate',f).innerHTML=gateRows(st); finish(false); return; }
        if(i===6){ $('#dp-gate',f).innerHTML=gateRows(st); finish(true); return; }
        st[i]='run'; $('#dp-gate',f).innerHTML=gateRows(st); i++; setTimeout(tick,420);
      };
      const finish=ok=>{
        a.deploys.forEach(d=>{ if(ok&&(d.status==='live'||d.status==='degraded')) d.status='replaced'; });
        a.deploys.unshift({v, sha, at:'just now', by:S.user.email, status:ok?'live':'blocked', gate:ok?'passed':'gitleaks: 1 secret in src/config.ts:12'});
        if(ok) Object.assign(a,{status:'live', version:v, sha, deployedAt:'just now', ord:0, by:S.user.email});
        audit('request_deploy','app:'+a.id, ok?'allowed':'denied');
        go.disabled=false; go.dataset.done='1'; go.textContent='Close'; $('[value="cancel"]',f)?.remove();
        toast(ok?`${a.name} ${v} is live`:`${a.name} ${v} blocked: secret in the code`); S.appTab='deploys';
        render(); /* Dialog liegt ausserhalb von #root: die Seite dahinter aktualisiert sich sofort */
      };
      tick(); return false;
    });
}

      if(!c) return fieldErr(f,'#of-c','#of-err','Enter the client.');
      if(!(q>0)||!(pr>=0)) return fieldErr(f,'#of-p','#of-err','Quantity and unit price must be numbers, quantity above zero.');
      const id='a'+S.nextNo; S.offers.unshift({id, no:'Q-2026-0'+S.nextNo++, client:c, contact:$('#of-m',f).value.trim()||'—', status:'draft', date:'today', valid:'—', items:[[$('#of-t',f).value.trim()||'Service',q,$('#of-u',f).value.trim()||'unit',pr]]});
      location.hash='run-quotes-'+id; toast('Quote created as draft');
    });
}

/* ---------- Befehlspalette ---------- */
function commands(){
  const go=(l,h,icon,g='Go to')=>({l,h,icon,g,run:()=>{ location.hash=h.slice(1); }});
  const act=(l,icon,fn)=>({l,icon,g:'Actions',h:'',run:fn});
  return [
    ...NAV.flatMap(g=>g.items.map(([id,l,icon])=>go(l,'#'+id,icon))),
    ...S.apps.map(a=>go(a.name,'#app-'+a.id,'apps','Apps')),
    ...S.apps.filter(a=>a.status!=='new').map(a=>go(`Open ${a.name}`,'#run-'+a.id,'arrow','Apps')),
    act('Create app','plus',dlgNewApp), act('Grant access','grants',()=>dlgNewGrant()), act('Create agent','agents',dlgNewAgent), act('Create group','groups',dlgNewGroup),
    act('Toggle light and dark',isDark()?'sun':'moon',toggleTheme), act('Sign out','out',signOut)
  ];
}
let pal=null;
function openPalette(){
  pal={q:'', i:0, restore:document.activeElement};
  const box=$('#palette');
  box.innerHTML=`<div class="palette"><div class="bg" data-act="palette-close"></div><div class="box" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="in">${ic('search')}<input id="pal-in" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" aria-label="Command palette" placeholder="Type a page, app or action…" autocomplete="off"><kbd>Esc</kbd></div>
    <ul id="pal-list" role="listbox" aria-label="Results"></ul>
    <div class="foot"><span>↑↓ to move</span><span>↵ to open</span><span>esc to close</span></div></div></div>`;
  const inp=$('#pal-in');
  inp.addEventListener('input',()=>{ pal.q=inp.value; pal.i=0; drawPalette(); });
  inp.addEventListener('keydown',e=>{
    const n=pal.items.length;
    if(e.key==='ArrowDown'){ e.preventDefault(); pal.i=n?(pal.i+1)%n:0; drawPalette(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); pal.i=n?(pal.i-1+n)%n:0; drawPalette(); }
    else if(e.key==='Enter'){ e.preventDefault(); runCommand(pal.items[pal.i]); }
    else if(e.key==='Escape'){ e.preventDefault(); closePalette(); }
    else if(e.key==='Tab'){ e.preventDefault(); }
  });
  drawPalette(); inp.focus();
}
function drawPalette(){
  const q=pal.q.trim().toLowerCase();
  const all=commands();
  pal.items = !q ? all : all.map((c,idx)=>[c.l.toLowerCase().startsWith(q)?0:c.l.toLowerCase().includes(q)?1:(c.g+' '+c.h).toLowerCase().includes(q)?2:9, idx, c]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]);
  let g=null;
  $('#pal-list').innerHTML = pal.items.length ? pal.items.map((c,i)=>{ const h=c.g!==g?`<li class="g label" role="presentation">${c.g}</li>`:''; g=c.g; return h+`<li class="o" role="option" id="pal-o${i}" data-pi="${i}" aria-selected="${i===pal.i}">${ic(c.icon)}<span class="l">${esc(c.l)}</span>${c.h?`<span class="h">${esc(c.h)}</span>`:''}</li>`; }).join('') : '<li class="none" role="presentation">No matches. Try “grant” or “quotes”.</li>';
  $('#pal-in').setAttribute('aria-activedescendant', pal.items.length?`pal-o${pal.i}`:'');
  $(`#pal-o${pal.i}`)?.scrollIntoView({block:'nearest'});
}
function closePalette(){ if(!pal) return; const r=pal.restore; pal=null; $('#palette').innerHTML=''; r?.focus?.(); }
function runCommand(c){ if(!c) return; closePalette(); c.run(); }

/* ---------- Popover ---------- */
function popover(kind){
  const p=$('#pop');
  if(p.dataset.kind===kind){ p.innerHTML=''; p.dataset.kind=''; return; }
  p.dataset.kind=kind;
  if(kind==='notes') p.innerHTML=`<div class="pop tr" role="dialog" aria-label="Notifications"><h3 class="label">Notifications</h3>${S.notes.length?S.notes.map(n=>`<a class="item" href="${n.href}"><span class="t">${esc(n.t)}</span><span class="s">${esc(n.s)}</span></a>`).join('')+'<div class="sep"></div><button class="item" data-act="read-all"><span class="s">Mark all as read</span></button>':'<div class="item"><span class="s">Nothing new. Findings and blocked deployments show up here.</span></div>'}</div>`;
  if(kind==='switcher') p.innerHTML=`<div class="pop tr" role="menu" aria-label="Switch app"><h3 class="label">Switch app</h3><a class="item" role="menuitem" href="#overview"><span class="t">Control plane</span><span class="s">cp.example.com</span></a>${S.apps.filter(a=>a.status!=='new').map(a=>`<a class="item" role="menuitem" href="#run-${a.id}"><span class="t">${esc(a.name)}</span><span class="s">apps.example.com/${esc(a.id)}</span></a>`).join('')}</div>`;
  if(kind==='user') p.innerHTML=`<div class="pop bl" role="menu" aria-label="Account"><div class="item" style="cursor:default"><span class="t">${esc(S.user.name)}</span><span class="s">${esc(S.user.email)} · platform-admins</span></div><div class="sep"></div><button class="item row" role="menuitem" data-act="theme"><span class="t">Toggle light and dark</span><span class="s">${isDark()?'dark':'light'}</span></button><button class="item row" role="menuitem" data-act="palette"><span class="t">Command palette</span><kbd>⌘K</kbd></button><div class="sep"></div><button class="item" role="menuitem" data-act="logout"><span class="t">Sign out</span></button></div>`;
}
const closePop = () => { const p=$('#pop'); p.innerHTML=''; p.dataset.kind=''; };

/* ---------- Router ---------- */
function route(){
  const h=(location.hash||'#overview').slice(1);
  if(!S.loggedIn && h!=='login'){ location.hash='login'; return {html:pageLogin()}; }
  if(h==='login') return {html:pageLogin()};
  if(h.startsWith('run-')){ const [id,...sub]=h.slice(4).split('-'); const st=S.apps.find(a=>a.id===id);
    if(st && st.status==='new'){ CRUMBS=[['Platform','#overview'],['Apps','#apps'],[st.name]]; return {html:shell('apps', EMPTY(`${st.name} is not deployed yet`,'The app runs after its first green review gate.', `<a class="btn primary" href="#app-${st.id}">Go to app settings</a>`))}; }
    if(id==='projects') return {html:runProjects(sub.join('-'))};
    if(id==='quotes') return {html:runQuotes(sub.join('-'))}; }
  if(h.startsWith('app-')){ const id=h.slice(4); return {html:shell('apps', pageApp(id)), id}; }
  const pages={overview:pageOverview, apps:pageApps, grants:pageGrants, groups:pageGroups, agents:pageAgents, connect:pageConnect, audit:pageAudit};
  const key=pages[h]?h:'overview';
  return {html:shell(key, pages[key]())};
}
const DEMO=$('.demo');
let currentApp=null;
function render(){
  const ae=document.activeElement, sid=ae?.dataset?.search, pos=ae?.selectionStart;
  const r=route(); currentApp=r.id||null;
  $('#root').innerHTML=r.html; ($('.col')||$('#root')).prepend(DEMO); document.body.classList.remove('nav-open'); $('.scrim')?.remove(); closePop();
  if(sid){ const i=$(`[data-search="${sid}"]`); if(i){ i.focus(); try{ i.setSelectionRange(pos,pos); }catch(e){} } }
}
function toggleTheme(){ document.documentElement.dataset.theme = isDark()?'light':'dark'; render(); }
function signOut(){ S.loggedIn=false; location.hash='login'; render(); }
window.addEventListener('hashchange',()=>{ S.appTab='overview'; render(); window.scrollTo(0,0); $('#main')?.focus({preventScroll:true}); });

document.addEventListener('input', e=>{ const s=e.target.closest?.('[data-search]'); if(s){ tbl(s.dataset.search).q=s.value; render(); } });
document.addEventListener('click', e=>{
  const tr=e.target.closest('tr[data-href]'); if(tr && !e.target.closest('button,a,input')){ location.hash=tr.dataset.href.slice(1); return; }
  const tab=e.target.closest('[data-tab]'); if(tab){ e.preventDefault(); S.appTab=tab.dataset.tab; render(); return; }
  const sb=e.target.closest('[data-sort]'); if(sb){ const st=tbl(sb.dataset.sort); if(st.sort===sb.dataset.k){ if(st.dir>0) st.dir=-1; else { st.sort=null; st.dir=1; } } else { st.sort=sb.dataset.k; st.dir=1; } render(); $(`[data-sort="${sb.dataset.sort}"][data-k="${sb.dataset.k}"]`)?.focus(); return; }
  const fb=e.target.closest('[data-filter]'); if(fb){ tbl(fb.dataset.filter).f=fb.dataset.v; render(); $(`[data-filter="${fb.dataset.filter}"][data-v="${fb.dataset.v}"]`)?.focus(); return; }
  const po=e.target.closest('[data-pi]'); if(po){ runCommand(pal.items[+po.dataset.pi]); return; }
  const el=e.target.closest('[data-act]');
  if(!el){ if(!e.target.closest('.pop')) closePop(); return; }
  const act=el.dataset.act, app=S.apps.find(a=>a.id===currentApp);
  if(!['notes','switcher','user'].includes(act)) closePop();
  switch(act){
    case 'nav': document.body.classList.add('nav-open'); { const s=document.createElement('div'); s.className='scrim'; s.addEventListener('click',()=>{ document.body.classList.remove('nav-open'); s.remove(); }); document.body.appendChild(s); $('.side .searchbtn')?.focus(); } break;
    case 'palette': document.body.classList.remove('nav-open'); $('.scrim')?.remove(); openPalette(); break;
    case 'palette-close': closePalette(); break;
    case 'notes': case 'switcher': case 'user': popover(act); break;
    case 'read-all': S.notes=[]; render(); toast('All notifications marked as read'); break;
    case 'theme': toggleTheme(); break;
    case 'logout': signOut(); break;
    case 'login': S.loggedIn=true; location.hash='overview'; render(); toast('Signed in as '+S.user.email); break;
    case 'retry': $('#demo-state').value='data'; listState='data'; render(); break;
    case 'clear-filters': { const st=tbl(el.dataset.id); st.q=''; st.f='all'; render(); $(`[data-search="${el.dataset.id}"]`)?.focus(); } break;
    case 'copy-cmd': copy($('#cmd').textContent); break;
    case 'new-agent': dlgNewAgent(); break;
    case 'disable-agent': { const a=S.agents.find(x=>x.name===el.dataset.n);
      confirmDialog({title:`Disable agent:${esc(a.name)}?`, text:'Its token stops working immediately; the next call gets 401. Its grants stay, so you can enable it again.', confirm:'Disable agent'}, ()=>{
        a.disabled=true; audit('disable_agent','agent:'+a.name); render();
        toast(`agent:${a.name} disabled`, ()=>{ a.disabled=false; audit('enable_agent','agent:'+a.name); render(); });
      }); } break;
    case 'new-grant': dlgNewGrant(el.dataset.res); break;
    case 'revoke': { const g=S.grants.find(x=>x.id===+el.dataset.id);
      confirmDialog({title:'Revoke this grant?', text:`<span class="mono">${esc(g.subject)}</span> will no longer be able to ${g.verb} <span class="mono">${esc(g.resource)}</span>, starting with the next call.`, confirm:'Revoke'}, ()=>{
        const idx=S.grants.indexOf(g); S.grants=S.grants.filter(x=>x!==g); audit('revoke',g.resource); render();
        toast('Grant revoked', ()=>{ S.grants.splice(idx,0,g); audit('grant',g.resource); render(); });
      }); } break;
    case 'new-group': dlgNewGroup(); break;
    case 'add-member': dlgAddMember(el.dataset.g); break;
    case 'new-app': dlgNewApp(); break;
    case 'deploy': if(app) dlgDeploy(app); break;
    case 'new-project': dlgNewProject(); break;
    case 'add-ms': dlgAddMs(el.dataset.id); break;
    case 'proj-status': { const p=S.projects.find(x=>x.id===el.dataset.id); p.status=p.status==='done'?'active':'done'; render(); toast(p.status==='done'?'Project marked as done':'Project reopened'); } break;
    case 'new-offer': dlgNewOffer(); break;
    case 'offer-set': { const o=S.offers.find(x=>x.id===el.dataset.id); const prev=o.status; o.status=el.dataset.s; if(o.status==='sent'){ o.date='today'; o.valid='in 30 days'; } render(); toast(`${o.no} marked as ${OFFER[o.status][1]}`, ()=>{ o.status=prev; render(); }); } break;
    case 'offer-draft': { const o=S.offers.find(x=>x.id===el.dataset.id); toast(`Draft to ${o.contact} is in your mailbox. Nothing is sent in the prototype.`); } break;
    case 'rollback': { if(!app) break; const d=app.deploys[+el.dataset.i]; if(!d) break;
      confirmDialog({title:`Roll back to ${esc(d.v)}?`, text:`${esc(app.name)} will run ${esc(d.v)} (${esc(d.sha)}) again. The current version stays in the history.`, confirm:'Roll back'}, ()=>{
        app.deploys.forEach(x=>{ if(x.status==='live'||x.status==='degraded') x.status='replaced'; }); d.status='live';
        Object.assign(app,{status:'live', version:d.v, sha:d.sha, deployedAt:'just now', ord:0, by:S.user.email}); audit('rollback','app:'+app.id); render(); toast(`${app.name} runs ${d.v} again`);
      }); } break;
  }
});
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); if(pal) closePalette(); else if(!dlg.open && S.loggedIn) openPalette(); return; }
  if(pal) return;
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
  if(e.key==='/' && !typing && !dlg.open){ const s=$('[data-search]'); if(s){ e.preventDefault(); s.focus(); } }
  if(e.key==='Escape'){ if(document.body.classList.contains('nav-open')){ document.body.classList.remove('nav-open'); $('.scrim')?.remove(); } closePop(); if(typing && e.target.dataset.search){ e.target.value=''; tbl(e.target.dataset.search).q=''; render(); } }
  if(e.key==='Enter' && !typing){ const tr=e.target.closest?.('tr[data-href]'); if(tr) location.hash=tr.dataset.href.slice(1); }
});
document.addEventListener('change', e=>{ const cb=e.target.closest?.('input[data-ms]'); if(!cb) return; const p=S.projects.find(x=>x.id===cb.dataset.p); p.ms[+cb.dataset.ms][2]=cb.checked; render(); $('#'+cb.id)?.focus(); });
$('#demo-state').addEventListener('change', e=>{ listState=e.target.value; render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
render();
})();
</script>
