/* ---------- Grundlage ---------- */
*,*::before,*::after{box-sizing:border-box;border-color:var(--oa-color-border)}
html{font-family:var(--oa-font-sans);-webkit-text-size-adjust:100%;background:var(--oa-color-bg)}
html,body{height:100%}
body{margin:0;background:var(--oa-color-bg);color:var(--oa-color-fg);font-size:var(--oa-text-sm);line-height:var(--oa-leading-sm);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--oa-color-bg)}
::selection{background:var(--oa-color-primary-subtle);color:var(--oa-color-primary-subtle-fg)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--oa-color-focus);outline-offset:2px}
.mono{font-family:var(--oa-font-mono);font-size:.8125rem;letter-spacing:0}
.muted{color:var(--oa-color-fg-muted)}
.subtle{color:var(--oa-color-fg-subtle)}
/* Das Mono-Label: Versalien, weite Laufweite. Der wiederkehrende Akzent. */
.label,.eyebrow,.crumbs,.navgroup h3,th,.card h2,.section h2,.pop h3,.field label,.appbrand .p,.kpi .k{font-family:var(--oa-font-mono);font-size:var(--oa-text-2xs);line-height:var(--oa-leading-2xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--oa-tracking-label);color:var(--oa-color-fg-muted)}
.x{color:var(--oa-color-fg-subtle);padding-inline:.35em}

/* ---------- Hinweisband: Klickdummy ---------- */
.demo{border-bottom:1px solid var(--oa-color-border);background:var(--oa-color-bg-subtle);color:var(--oa-color-fg-muted);font-family:var(--oa-font-mono);font-size:var(--oa-text-2xs);line-height:var(--oa-leading-2xs);letter-spacing:.02em;padding-block:var(--oa-space-2);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:var(--oa-space-1) var(--oa-space-4);align-items:center}
.demo strong{text-transform:uppercase;letter-spacing:var(--oa-tracking-label);color:var(--oa-color-fg);font-weight:500}
.demo label{display:flex;gap:var(--oa-space-2);align-items:center;margin-left:auto;text-transform:uppercase;letter-spacing:var(--oa-tracking-label)}
.demo select{background:var(--oa-color-bg);border:1px solid var(--oa-color-border-strong);border-radius:var(--oa-radius-full);padding:var(--oa-space-0_5) var(--oa-space-2);font-family:var(--oa-font-mono);font-size:var(--oa-text-2xs);color:var(--oa-color-fg)}
@media (max-width:640px){.demo label{margin-left:0}}

/* ---------- Shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:3.5rem;display:flex;align-items:center;gap:var(--oa-space-2);border-bottom:1px solid var(--oa-color-border);background:var(--oa-color-bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;gap:var(--oa-space-2);align-items:center;white-space:nowrap;font-family:var(--oa-font-mono);font-size:var(--oa-text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--oa-tracking-loose);color:var(--oa-color-fg);text-decoration:none}
.brand::before{content:"";width:.625rem;height:.625rem;background:var(--oa-color-primary);flex-shrink:0}

.top .spacer{flex:1}
.iconbtn{width:2.25rem;height:2.25rem;border-radius:var(--oa-radius-full);border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;color:var(--oa-color-fg-muted);position:relative;transition:background-color .15s,color .15s}
.iconbtn:hover{background:var(--oa-color-surface-hover);color:var(--oa-color-fg)}
.iconbtn svg{width:1.125rem;height:1.125rem}
.dot{position:absolute;top:.4rem;right:.45rem;width:.4375rem;height:.4375rem;border-radius:var(--oa-radius-full);background:var(--oa-color-danger);box-shadow:0 0 0 2px var(--oa-color-bg)}

.menu-toggle{display:none}
.layout{display:grid;grid-template-columns:var(--oa-size-nav) minmax(0,1fr);min-height:calc(100% - 3.5rem)}
nav.side{border-right:1px solid var(--oa-color-border);background:var(--oa-color-bg);padding:var(--oa-space-6) var(--oa-space-3);display:flex;flex-direction:column;gap:var(--oa-space-8)}
@media (min-width:768px){nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.5rem);align-self:start;height:calc(100vh - 3.5rem);overflow-y:auto}}
.navgroup{display:flex;flex-direction:column;gap:1px}
.navgroup h3{margin:0 0 var(--oa-space-2) var(--oa-space-3)}
.navlink{display:flex;align-items:center;justify-content:space-between;gap:var(--oa-space-2);padding:var(--oa-space-2) var(--oa-space-3);border-radius:var(--oa-radius-sm);color:var(--oa-color-fg-muted);text-decoration:none;transition:background-color .15s,color .15s}
.navlink:hover{background:var(--oa-color-surface-hover);color:var(--oa-color-fg)}
.navlink[aria-current="page"]{background:var(--oa-color-surface-hover);color:var(--oa-color-fg);font-weight:500;box-shadow:inset 2px 0 0 var(--oa-color-primary)}
.navlink .count{font-family:var(--oa-font-mono);font-size:var(--oa-text-2xs);color:var(--oa-color-fg-subtle);font-variant-numeric:tabular-nums}
main{min-width:0;padding-block:var(--oa-space-10) var(--oa-space-16,4rem);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:768px){main{padding-left:var(--oa-space-12);padding-right:max(var(--oa-space-12),env(safe-area-inset-right,0px))}}
.page{max-width:68rem;display:flex;flex-direction:column;gap:var(--oa-space-8)}

@media (max-width:767px){
  .menu-toggle{display:grid}
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(var(--oa-size-nav),85vw);transform:translateX(-100%);transition:transform .2s ease;padding-top:calc(env(safe-area-inset-top,0px) + var(--oa-space-6));padding-left:max(var(--oa-space-3),env(safe-area-inset-left,0px));box-shadow:var(--oa-shadow-lg)}
  body.nav-open nav.side{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:var(--oa-color-overlay)}
  .hide-sm{display:none}
  main{padding-top:var(--oa-space-8)}
  .page{gap:var(--oa-space-6)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Kopf einer Seite ---------- */
.eyebrow{display:flex;align-items:center;gap:var(--oa-space-3);margin-bottom:calc(-1 * var(--oa-space-4))}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--oa-color-border)}
.head{display:flex;flex-wrap:wrap;gap:var(--oa-space-4) var(--oa-space-6);align-items:flex-end;justify-content:space-between;padding-bottom:var(--oa-space-8);border-bottom:1px solid var(--oa-color-border)}
.head > div:first-child{min-width:0;flex:1 1 24rem}
.head h1{margin:0;font-family:var(--oa-font-display);font-weight:400;font-size:var(--oa-text-5xl);line-height:var(--oa-leading-5xl);letter-spacing:var(--oa-tracking-display);text-wrap:balance;display:flex;flex-wrap:wrap;align-items:center;gap:var(--oa-space-2) var(--oa-space-4)}
.head h1 .badge{font-family:var(--oa-font-mono);letter-spacing:var(--oa-tracking-label)}

/* ---------- Knöpfe: Pillen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--oa-space-1_5);min-height:2.375rem;padding:0 var(--oa-space-5);border-radius:var(--oa-radius-full);border:1px solid var(--oa-color-border-strong);background:var(--oa-color-bg);color:var(--oa-color-fg);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--oa-color-fg);background:var(--oa-color-surface)}
.btn.primary{background:var(--oa-color-primary);border-color:var(--oa-color-primary);color:var(--oa-color-primary-fg)}
.btn.primary:hover{background:var(--oa-color-primary-hover);border-color:var(--oa-color-primary-hover)}
.btn.danger{background:var(--oa-color-danger);border-color:var(--oa-color-danger);color:var(--oa-color-danger-fg)}

const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),3200); }
const STATUS = {live:['success','läuft'], degraded:['warning','läuft mit Befund'], neu:['plain','noch nicht deployt'], 'blockiert':['danger','blockiert'], 'abgelöst':['plain','abgelöst'], 'läuft':['primary','prüft …'], 'zurückgesetzt':['primary','zurückgesetzt']};
function badge(status){ const [tone,label]=STATUS[status]||['plain',status]; return `<span class="badge ${tone}">${esc(label)}</span>`; }
function verbBadge(v){ const tone={read:'plain',write:'primary',execute:'warning'}[v]||'plain'; const label={read:'lesen',write:'schreiben',execute:'ausführen'}[v]||v; return `<span class="badge plain ${tone==='plain'?'':tone}">${label}</span>`; }

function listOr(rows, {emptyTitle, emptyText, emptyAction, errorTitle}){
  if(listState==='error') return `<div class="state error" role="alert"><h2>${esc(errorTitle)}</h2><p>Die Control Plane hat nicht geantwortet (Zeitüberschreitung nach 30 s). Seite neu laden; hält der Fehler an, steht der Grund im Log des Containers.</p><button class="btn" data-act="retry">Erneut laden</button></div>`;
  if(listState==='empty' || rows==='') return `<div class="state"><h2>${esc(emptyTitle)}</h2><p>${esc(emptyText)}</p>${emptyAction||''}</div>`;
  return rows;
}

const NAV = [

function shell(active, content, ctx){

  const eyebrow = hit && !content.includes('class="crumbs"') ? `<div class="eyebrow">${esc(hit.g)}<span class="x">×</span>${esc(hit.l)}</div>` : '';
  const nav = navDef.map(g=>`<div class="navgroup"><h3>${g.title}</h3>${g.items.map(([id,label,count])=>`<a class="navlink" href="#${id}" ${active===id?'aria-current="page"':''}><span>${label}</span>${count?`<span class="count">${count()}</span>`:''}</a>`).join('')}</div>`).join('');
  return `
  <header class="top">
    <button class="iconbtn menu-toggle" data-act="nav" aria-label="Navigation öffnen">${I.menu}</button>
    ${ctx ? `<a class="appbrand" href="#run-${ctx.id}"><span class="p">openapps</span><span class="n">${esc(ctx.name)}</span></a>` : '<a class="brand" href="#apps">openapps<small class="hide-sm">/ Control Plane</small></a>'}

    <div id="pop"></div>
  </header>
  <div class="layout">
    <nav class="side" aria-label="Hauptnavigation">${nav}</nav>
    <main id="main"><div class="page">${eyebrow}${content}</div></main>
  </div>`;
}

function gateRows(state){
  const steps=[
    ['gitleaks','Keine Secrets im Code','Sperrt'],
    ['semgrep','Sicherheitsregeln (p/owasp-top-ten)','Sperrt'],
    ['UI-Linter','Nur Komponenten und Tokens aus @openapps/ui','Sperrt'],
    ['Manifest','app.json passt zu Code, Tabellen und Tools','Sperrt'],
    ['gateway-config','Router mit Forward-Auth, kein Host-Port, kein zweites Netz','Sperrt'],
    ['KI-Review','Bericht eines Frontier-Modells, eigener Schlüssel','Hinweis']
  ];
  return steps.map(([name,what,kind],i)=>{
    const st = state[i]||'wait';
    const mark = {ok:'<span class="mark ok">✓</span>',fail:'<span class="mark fail">!</span>',info:'<span class="mark info">i</span>',run:'<span class="mark run" aria-label="läuft"></span>',wait:'<span class="mark">·</span>'}[st];
    const tag = kind==='Hinweis'?'<span class="badge primary plain">Hinweis, sperrt nicht</span>':'<span class="badge plain">sperrt</span>';
    return `<div class="row">${mark}<div><div class="what">${name}</div><div class="why">${what}</div></div>${tag}</div>`;
  }).join('');
}

const dlg = $('#dlg');
function openDialog(html, onSubmit){
  dlg.innerHTML = `<form method="dialog" novalidate>${html}</form>`;
  const f = $('form', dlg);
  f.addEventListener('submit', e=>{ e.preventDefault(); const btn=e.submitter; if(btn && btn.value==='cancel'){ dlg.close(); return; } if(onSubmit(f)!==false) dlg.close(); });
  dlg.showModal(); const first = $('input,select', dlg); if(first) first.focus();
}
const cancelBtn = '<button class="btn" value="cancel" formnovalidate>Abbrechen</button>';

function dlgNewAgent(){
  openDialog(`<h2>Agent anlegen</h2><p>Der Agent bekommt eine eigene Identität. Er darf nichts, bis du ihm Freigaben gibst.</p>
    <div class="field"><label for="ag-name">Kennung</label><input class="input mono" id="ag-name" placeholder="claude-lena" autocomplete="off"><span class="hint">Kleinbuchstaben, Ziffern, Bindestrich. Steht in Freigaben als agent:&lt;kennung&gt;.</span><span class="err" id="ag-err" hidden></span></div>

      const n=$('#ag-name',f).value.trim(), d=$('#ag-display',f).value.trim()||n, err=$('#ag-err',f), inp=$('#ag-name',f);
      let msg='';
      if(!/^[a-z][a-z0-9-]{1,62}$/.test(n)) msg='Bitte mit einem Kleinbuchstaben beginnen, mindestens zwei Zeichen, nur a–z, 0–9 und Bindestrich.';
      else if(S.agents.some(a=>a.name===n)) msg='Diese Kennung gibt es schon.';
      if(msg){ err.textContent=msg; err.hidden=false; inp.setAttribute('aria-invalid','true'); inp.focus(); return false; }
      S.agents.unshift({name:n, display:d, owner:S.user.email, seen:'noch nie', disabled:false});
      S.audit.unshift({at:'jetzt', who:S.user.email, what:'create_agent', on:'agent:'+n, out:'allowed'});
      setTimeout(()=>dlgToken(n),0); render();

function dlgToken(n){
  const tok = 'oac_'+rand(16)+'.'+rand(43);
  openDialog(`<h2>Token für agent:${esc(n)}</h2><p>Dieses Token wird nur jetzt angezeigt. Gespeichert ist nur sein Hash; verlierst du es, legst du den Agent neu an.</p>
    <div class="secret"><code id="tok">${tok}</code><button class="btn" type="button" id="copy">Kopieren</button></div>
    <div class="callout">Beispielwert aus dem Klickdummy, nicht verwendbar. Ein echtes Token gehört nur in die Konfiguration deines MCP-Clients, nicht in einen Chat oder ein Repo.</div>
    <pre class="code">claude mcp add --transport http openapps https://cp.enaibler.ai/mcp \\
  --header "Authorization: Bearer ${tok.slice(0,12)}…"</pre>
    <div class="dialog-actions"><a class="btn" href="#grants" id="to-grants">Freigaben geben</a><button class="btn primary" value="ok">Fertig</button></div>`, ()=>true);
  $('#copy',dlg).addEventListener('click',()=>{ navigator.clipboard?.writeText(tok).then(()=>toast('Kopiert'),()=>{ const r=document.createRange(); r.selectNodeContents($('#tok',dlg)); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Markiert, mit Cmd+C kopieren'); }); });
  $('#to-grants',dlg).addEventListener('click',()=>dlg.close());
}
function rand(n){ const c='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_'; let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

function dlgNewGrant(res){

  openDialog(`<h2>Freigabe vergeben</h2><p>Gilt ab dem nächsten Aufruf. Widerrufen geht jederzeit.</p>
    <div class="field"><label for="gr-s">Wer</label><select class="select" id="gr-s">${subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>

    <div class="field"><label for="mb-e">E-Mail</label><input class="input" id="mb-e" type="email" placeholder="name@blyck.de"><span class="err" id="mb-err" hidden></span></div>
    <div class="dialog-actions">${cancelBtn}<button class="btn primary" value="ok">Aufnehmen</button></div>`, f=>{
      const e=$('#mb-e',f).value.trim().toLowerCase(), err=$('#mb-err',f);
      if(!/^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/.test(e)){ err.textContent='Bitte eine E-Mail-Adresse ohne Komma eingeben.'; err.hidden=false; $('#mb-e',f).setAttribute('aria-invalid','true'); return false; }
      if(!e.endsWith('@blyck.de')){ err.textContent='Nur Adressen von blyck.de dürfen sich anmelden (AUTH_ALLOWED_EMAIL_DOMAINS).'; err.hidden=false; return false; }
      const grp=S.groups.find(x=>x.name===g); if(!grp.members.includes(e)) grp.members.push(e); render(); toast(`${e} ist jetzt in ${g}`);
    });
}
function dlgNewApp(){
  openDialog(`<h2>App anlegen</h2><p>Legt ein Repo aus dem Starter-Template an, dazu Schema und Rolle. Live ist die App erst nach dem ersten grünen Review-Gate.</p>
    <div class="field"><label for="ap-n">Name</label><input class="input mono" id="ap-n" placeholder="reisekosten"><span class="hint">Wird zum Pfad apps.enaibler.ai/&lt;name&gt; und zum Schema app_&lt;name&gt;.</span><span class="err" id="ap-err" hidden></span></div>
    <div class="dialog-actions">${cancelBtn}<button class="btn primary" value="ok">Anlegen</button></div>`, f=>{
      const n=$('#ap-n',f).value.trim(), err=$('#ap-err',f);
      if(!/^[a-z][a-z0-9-]{1,40}$/.test(n)){ err.textContent='Kleinbuchstaben, Ziffern und Bindestrich, mindestens zwei Zeichen.'; err.hidden=false; $('#ap-n',f).setAttribute('aria-invalid','true'); return false; }
      if(S.apps.some(a=>a.id===n)){ err.textContent='Diese App gibt es schon.'; err.hidden=false; return false; }
      S.apps.push({id:n, name:n[0].toUpperCase()+n.slice(1), status:'neu', version:null, sha:null, deployedAt:null, by:null, schema:'app_'+n.replace(/-/g,'_'), tools:['items.list','items.create'], tables:['items'], deploys:[]});
      S.audit.unshift({at:'jetzt', who:S.user.email, what:'create_app', on:'app:'+n, out:'allowed'});
      location.hash='app-'+n; toast('Repo angelegt: blyck/'+n);
    });
}
function dlgDeploy(a){
  const ver = a.version ? a.version.replace(/(\d+)$/, m=>String(+m+1)) : 'v0.1.0';
  openDialog(`<h2>Deploy anfordern: ${esc(a.name)}</h2><p>Die Control Plane holt den Commit selbst von GitHub und prüft ihn. Ein lokaler Pfad ist nicht nötig.</p>
    <div class="field"><label for="dp-v">Version</label><input class="input mono" id="dp-v" value="${ver}"></div>
    <div class="field"><label for="dp-s">Commit</label><input class="input mono" id="dp-s" value="${rand(7).toLowerCase().replace(/[^a-f0-9]/g,'e')}"></div>
    <div class="field"><label for="dp-x">Ergebnis im Klickdummy</label><select class="select" id="dp-x"><option value="ok">Gate grün, wird deployt</option><option value="secret">gitleaks findet ein Secret</option></select><span class="hint">Nur im Dummy, um beide Wege zu sehen.</span></div>
    <div class="section"><div class="gate" id="dp-gate">${gateRows([])}</div></div>
    <div class="dialog-actions">${cancelBtn}<button class="btn primary" value="ok" id="dp-go">Prüfen und deployen</button></div>`, f=>{
      const go=$('#dp-go',f); if(go.dataset.done){ return true; }
      go.disabled=true; const fail=$('#dp-x',f).value==='secret';
      const v=$('#dp-v',f).value.trim(), sha=$('#dp-s',f).value.trim();
      const st=[]; let i=0;
      const tick=()=>{
        if(i>0) st[i-1] = (fail && i-1===0) ? 'fail' : (i-1===5 ? 'info' : 'ok');
        if(fail && i===1){ $('#dp-gate',f).innerHTML=gateRows(st); finish(false); return; }
        if(i===6){ $('#dp-gate',f).innerHTML=gateRows(st); finish(true); return; }
        st[i]='run'; $('#dp-gate',f).innerHTML=gateRows(st); i++; setTimeout(tick,450);
      };
      const finish=(ok)=>{
        a.deploys.forEach(d=>{ if(ok && (d.status==='live'||d.status==='degraded')) d.status='abgelöst'; });
        a.deploys.unshift({v, sha, at:'gerade eben', by:S.user.email, status: ok?'live':'blockiert', gate: ok?'grün':'gitleaks: 1 Secret in src/config.ts:12'});
        if(ok){ Object.assign(a,{status:'live', version:v, sha, deployedAt:'gerade eben', by:S.user.email}); }
        S.audit.unshift({at:'jetzt', who:S.user.email, what:'request_deploy', on:'app:'+a.id, out: ok?'allowed':'denied'});
        go.disabled=false; go.dataset.done='1'; go.textContent='Schließen'; const c=$('[value="cancel"]',f); if(c) c.remove();
        toast(ok?`${a.name} ${v} ist live`:`${a.name} ${v} blockiert: Secret im Code`); S.appTab='deploys';
        dlg.addEventListener('close',render,{once:true});
      };
      tick(); return false;
    });
}

/* ---------- Popover ---------- */
function popover(kind){
  const p=$('#pop'); if(!p) return;
  if(p.dataset.kind===kind){ p.innerHTML=''; p.dataset.kind=''; return; }
  p.dataset.kind=kind;
  if(kind==='notes') p.innerHTML=`<div class="pop" role="dialog" aria-label="Benachrichtigungen"><h3>Benachrichtigungen</h3>${S.notes.length?S.notes.map(n=>`<a class="item" href="${n.href}" style="text-decoration:none;color:inherit"><span class="t">${esc(n.t)}</span><span class="s">${esc(n.s)}</span></a>`).join(''):'<div class="item"><span class="s">Nichts Neues.</span></div>'}${S.notes.length?'<button class="btn sm ghost" data-act="read-all">Alle als gelesen markieren</button>':''}</div>`;
  if(kind==='user') p.innerHTML=`<div class="pop" role="menu"><div class="item"><span class="t">${esc(S.user.name)}</span><span class="s">${esc(S.user.email)} · platform-admins</span></div><button class="item" data-act="theme" role="menuitem"><span class="t">Hell / dunkel umschalten</span></button><button class="item" data-act="logout" role="menuitem"><span class="t">Abmelden</span></button></div>`;
  if(kind==='switcher') p.innerHTML=`<div class="pop" role="menu"><h3>Apps</h3><a class="item" href="#apps" style="text-decoration:none;color:inherit"><span class="t">Control Plane</span><span class="s">cp.enaibler.ai</span></a>${S.apps.filter(a=>a.status!=='neu').map(a=>`<a class="item" href="#run-${a.id}" style="text-decoration:none;color:inherit"><span class="t">${esc(a.name)}</span><span class="s">apps.enaibler.ai/${esc(a.id)}</span></a>`).join('')}</div>`;
}

/* ---------- Router ---------- */
function route(){
  const h=(location.hash||'#apps').slice(1);
  if(!S.loggedIn && h!=='login'){ location.hash='login'; return {html:pageLogin(), bare:true}; }
  if(h==='login') return {html:pageLogin(), bare:true};
  if(h.startsWith('run-')){ const rest=h.slice(4); const [id,...sub]=rest.split('-'); const st=S.apps.find(a=>a.id===id);
    if(st && st.status==='neu') return {html:shell('apps', `<div class="state"><h2>${esc(st.name)} ist noch nicht deployt</h2><p>Die App läuft erst nach dem ersten grünen Review-Gate.</p><a class="btn primary" href="#app-${st.id}">Zur App</a></div>`)};
    if(id==='projektliste') return {html:runProjektliste(sub.join('-'))};
    if(id==='angebote') return {html:runAngebote(sub.join('-'))}; }
  if(h.startsWith('app-')) return {html:shell('apps', pageApp(h.slice(4))), id:h.slice(4)};
  const pages={apps:pageApps, grants:pageGrants, groups:pageGroups, agents:pageAgents, connect:pageConnect, audit:pageAudit};
  return {html:shell(pages[h]?h:'apps', (pages[h]||pageApps)())};
}
let currentApp=null;
function render(){
  const r=route(); currentApp=r.id||null;
  $('#root').innerHTML=r.html; document.body.classList.remove('nav-open'); $('.scrim')?.remove();
}
window.addEventListener('hashchange',()=>{ S.appTab='overview'; render(); window.scrollTo(0,0); });

document.addEventListener('click', e=>{
  const tr=e.target.closest('tr[data-href]'); if(tr && !e.target.closest('button,a')){ location.hash=tr.dataset.href.slice(1); return; }
  const tab=e.target.closest('[data-tab]'); if(tab){ S.appTab=tab.dataset.tab; render(); return; }
  const el=e.target.closest('[data-act]'); if(!el) { if(!e.target.closest('.pop,.iconbtn')){ const p=$('#pop'); if(p){p.innerHTML='';p.dataset.kind='';} } return; }
  const act=el.dataset.act; const app=S.apps.find(a=>a.id===currentApp);
  switch(act){
    case 'nav': document.body.classList.add('nav-open'); { const s=document.createElement('div'); s.className='scrim'; s.addEventListener('click',()=>{document.body.classList.remove('nav-open'); s.remove();}); document.body.appendChild(s); $('nav.side a')?.focus(); } break;
    case 'notes': case 'user': case 'switcher': popover(act); break;
    case 'read-all': S.notes=[]; render(); break;
    case 'theme': { const d=document.documentElement; const dark = d.dataset.theme ? d.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; d.dataset.theme = dark?'light':'dark'; popover('user'); } break;
    case 'logout': S.loggedIn=false; location.hash='login'; render(); break;
    case 'login': S.loggedIn=true; location.hash='apps'; render(); toast('Angemeldet als '+S.user.email); break;
    case 'retry': document.getElementById('demo-state').value='data'; listState='data'; render(); break;
    case 'new-agent': dlgNewAgent(); break;
    case 'disable-agent': { const a=S.agents.find(x=>x.name===el.dataset.n); a.disabled=true; S.audit.unshift({at:'jetzt', who:S.user.email, what:'disable_agent', on:'agent:'+a.name, out:'allowed'}); render(); toast(`agent:${a.name} gesperrt. Der nächste Aufruf bekommt 401.`); } break;
    case 'new-grant': dlgNewGrant(el.dataset.res); break;
    case 'revoke': { const g=S.grants.find(x=>x.id===+el.dataset.id); S.grants=S.grants.filter(x=>x!==g); S.audit.unshift({at:'jetzt', who:S.user.email, what:'revoke', on:g.resource, out:'allowed'}); render(); toast(`Widerrufen: ${g.subject} → ${g.resource}`); } break;
    case 'new-group': dlgNewGroup(); break;
    case 'add-member': dlgAddMember(el.dataset.g); break;
    case 'new-app': dlgNewApp(); break;
    case 'deploy': if(app) dlgDeploy(app); break;
    case 'proj-filter': S.projFilter=el.dataset.f; render(); break;
    case 'new-project': dlgNewProject(); break;
    case 'add-ms': dlgAddMs(el.dataset.id); break;
    case 'proj-status': { const p=S.projects.find(x=>x.id===el.dataset.id); p.status = p.status==='abgeschlossen'?'aktiv':'abgeschlossen'; render(); toast(p.status==='abgeschlossen'?'Projekt abgeschlossen':'Projekt wieder geöffnet'); } break;
    case 'new-offer': dlgNewOffer(); break;
    case 'offer-set': { const o=S.offers.find(x=>x.id===el.dataset.id); o.status=el.dataset.s; if(o.status==='versendet'){ o.date='heute'; o.valid='in 30 Tagen'; } render(); toast(`${o.no}: ${OFFER[o.status][1]}`); } break;
    case 'offer-draft': { const o=S.offers.find(x=>x.id===el.dataset.id); toast(`Entwurf an ${o.contact} liegt in deinem Postfach. Im Dummy wird nichts gesendet.`); } break;
    case 'open-app': e.preventDefault(); toast(app && app.status!=='neu' ? `Öffnet apps.enaibler.ai/${app.id} (im Dummy nicht verfügbar)` : 'Die App ist noch nicht deployt'); break;
    case 'rollback': { const d=app.deploys[+el.dataset.i]; app.deploys.forEach(x=>{ if(x.status==='live'||x.status==='degraded') x.status='abgelöst'; }); d.status='live'; Object.assign(app,{status:'live', version:d.v, sha:d.sha, deployedAt:'gerade eben', by:S.user.email}); S.audit.unshift({at:'jetzt', who:S.user.email, what:'rollback', on:'app:'+app.id, out:'allowed'}); render(); toast(`${app.name} läuft wieder mit ${d.v}`); } break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const tr=e.target.closest?.('tr[data-href]'); if(tr) location.hash=tr.dataset.href.slice(1); }
  if(e.key==='Escape' && document.body.classList.contains('nav-open')){ document.body.classList.remove('nav-open'); $('.scrim')?.remove(); }
});
document.addEventListener('change', e=>{ const cb=e.target.closest?.('input[data-ms]'); if(!cb) return; const p=S.projects.find(x=>x.id===cb.dataset.p); p.ms[+cb.dataset.ms][2]=cb.checked; render(); $('#'+cb.id)?.focus(); });
document.getElementById('demo-state').addEventListener('change', e=>{ listState=e.target.value; render(); });
render();
})();
</script>
