# The source of truth for this app's functions.
# The platform generates the MCP tools from this file. A UI action without a
# matching operation here blocks the review gate.
openapi: 3.1.0
info:
  title: Starter App
  version: 0.1.0
  description: Template. Describe every function here before you build a screen.
servers:
  # Every app lives under a path on the shared domain (ADR 0007), so `/api`
  # alone is not this app's address. `basePath` is the path the control plane
  # sets per deployment in OPENAPPS_APP_BASE_PATH and that next.config.js uses
  # as basePath; the default here is this app's path. If you rename the app,
  # change it too.
  - url: '{basePath}/api'
    description: This app behind the gateway.
    variables:
      basePath:
        default: /starter-app
        description: Path of the app, byte-identical to OPENAPPS_APP_BASE_PATH.
paths:
  /items:
    get:
      operationId: listItems
      summary: Lists items
      x-openapps-verb: read
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text filter
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }
        '401': { description: Not a valid gateway request }
    post:
      operationId: createItem
      summary: Creates an item
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { description: Validation failed }
        '401': { description: Not a valid gateway request }
components:
  schemas:
    Item:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        createdAt: { type: string, format: date-time }
    ItemInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
