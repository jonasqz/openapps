# The source of truth for what this app can do.
# The platform generates the MCP tools from this file. A UI action without a
# matching operation here blocks the review gate.
#
# Every operation is a tool: POST /tools/<toolname> with the arguments as the
# JSON body (`createToolRoute` from @openapps/sdk). The tool name is listed in
# app.json under offeredTools, with the same operationId.
openapi: 3.1.0
info:
  title: Knowledge
  version: 0.3.0
  description: >-
    The shared search of the platform, an optional RAG. Store documents, let
    other apps deliver their content (documents.upsert, documents.remove), and
    find relevant passages with their source. Without a model the search is
    full text and the calling agent writes the answer itself, from the returned
    passages and citing their sources. If the operator configured a model,
    search also ranks by meaning (hybrid) and answer writes a short answer
    whose citations are checked against the passages. Content from another
    app is only visible to callers that may read that app.
servers:
  # Every app lives under a path on the shared domain (ADR 0007).
  # `basePath` is the path the control plane sets per deployment in
  # OPENAPPS_APP_BASE_PATH and that next.config.js uses as basePath.
  - url: '{basePath}/api'
    description: This app behind the gateway.
    variables:
      basePath:
        default: /knowledge
        description: Path of the app, byte-for-byte equal to OPENAPPS_APP_BASE_PATH.
paths:
  /tools/search:
    post:
      operationId: search
      summary: Find passages for a question
      description: >-
        Searches the internal documents and the content other apps delivered
        (for example wiki pages) for passages on a question or keyword.
        German and English full-text search: word forms are matched in both
        languages ("trips" finds "trip", "erstatten" finds "erstattet").
        Quotes search for a phrase, a leading minus excludes a word. If the
        exact query finds too little, the search adds matches that contain only
        some of the words. Every passage comes back with chunkId, documentId,
        documentTitle, source, sourceApp and sourceUrl; excerpt marks the
        matches with « and ». Content from an app the caller may not read is
        never returned. If an embedding model is configured and every visible
        section is embedded, full text and vector matches are merged
        (reciprocal rank fusion); the input and the shape of the output stay
        the same, only the order can change. Answer only from these passages
        and cite the source for every statement (documentTitle,
        sourceApp/sourceUrl or source, and documentId/chunkId). An empty list
        means the documents say nothing about it — do not guess.
      x-openapps-verb: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchInput' }
      responses:
        '200':
          description: Passages found, best match first
          content:
            application/json:
              schema:
                type: object
                required: [passages]
                properties:
                  passages:
                    type: array
                    items: { $ref: '#/components/schemas/Passage' }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
  /tools/answer:
    post:
      operationId: answer
      summary: Answer a question with checked citations
      description: >-
        Searches like search, with the caller's visibility, and gives only
        those passages to the platform model (platform.generate, counted on
        app:knowledge). The model has to cite the chunkId of every passage it
        relies on. Every citation is checked against the passages it was
        given; an answer without a citation, or with one that points anywhere
        else, is discarded and comes back as no_answer with the passages, so
        the caller can answer from them instead of guessing. Passages from
        apps the operator keeps in-house never reach an external provider.
        Without a chat model the status is not_configured; use search then.
      x-openapps-verb: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: false
              properties:
                question: { type: string, minLength: 1, maxLength: 500 }
                limit: { type: integer, minimum: 1, maximum: 20, default: 8, description: Maximum number of passages given to the model }
      responses:
        '200':
          description: An answer with citations, no answer with the passages, or not configured
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, answer, citations, passages]
                    properties:
                      status: { type: string, enum: [answered] }
                      answer: { type: string }
                      citations:
                        type: array
                        minItems: 1
                        items: { $ref: '#/components/schemas/Citation' }
                      passages:
                        type: array
                        items: { $ref: '#/components/schemas/Passage' }
                  - type: object
                    required: [status, reason, message, passages]
                    properties:
                      status: { type: string, enum: [no_answer] }
                      reason:
                        type: string
                        enum:
                          [no_passages, not_in_sources, no_citation, invalid_citation, unreadable, withheld, budget_exceeded, model_error]
                      message: { type: string }
                      passages:
                        type: array
                        items: { $ref: '#/components/schemas/Passage' }
                  - type: object
                    required: [status, message]
                    properties:
                      status: { type: string, enum: [not_configured] }
                      message: { type: string }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
  /tools/documents.search:
    post:
      operationId: searchDocuments
      summary: Find documents for the platform search
      description: >-
        The search tool of Knowledge for the platform search across all apps
        (manifest field search). Finds documents stored in Knowledge itself,
        one hit per document, best match first. Content other apps delivered
        (for example wiki pages) is not included; the platform finds it in
        those apps. To answer a question with sources use search instead.
      x-openapps-verb: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              additionalProperties: false
              properties:
                query: { type: string, minLength: 1, maxLength: 200 }
                limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: Documents found, best match first
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                      required: [id, title, snippet, url, kind]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        snippet: { type: string, description: 'Excerpt, matches wrapped in « and »' }
                        url: { type: string, description: 'Path of the document without the base path, /documents/<id>' }
                        kind: { type: string, enum: [document] }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
  /tools/documents.add:
    post:
      operationId: addDocument
      summary: Store a document
      description: >-
        Stores a document and, in one transaction, splits it into sections of
        about 800 characters with about 150 characters of overlap. It can be
        found through search right away. content is plain text; separate
        paragraphs with blank lines so the split happens at paragraph breaks.
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentInput' }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [id, chunkCount]
                properties:
                  id: { type: string, format: uuid }
                  chunkCount: { type: integer, minimum: 1 }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
  /tools/documents.list:
    post:
      operationId: listDocuments
      summary: List documents
      description: >-
        Lists the stored documents the caller can see, without full text,
        newest first, at most 200. Documents from other apps carry sourceApp
        and sourceUrl. q filters by title or source (substring,
        case-insensitive). For questions about content use search.
      x-openapps-verb: read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                q: { type: string, maxLength: 200, description: Filter on title or source }
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
  /tools/documents.get:
    post:
      operationId: getDocument
      summary: Read a document
      description: >-
        Reads a document with full text. With includeChunks true the sections
        are included in order. A deleted or unknown document, or one from an
        app the caller may not read, returns 404.
      x-openapps-verb: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                includeChunks: { type: boolean, default: false }
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  chunks:
                    type: array
                    items: { $ref: '#/components/schemas/Chunk' }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
        '404': { description: The document does not exist or has been deleted }
  /tools/documents.delete:
    post:
      operationId: deleteDocument
      summary: Delete a document
      description: >-
        Soft-deletes a document. It and its sections no longer appear in
        search, documents.list or documents.get. A document delivered by
        another app (sourceApp set) cannot be deleted here and returns 400; it
        is removed in that app.
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string, format: uuid }
                  deleted: { type: boolean, const: true }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
        '404': { description: The document does not exist or has already been deleted }
  /tools/documents.upsert:
    post:
      operationId: upsertDocument
      summary: Deliver or replace content from the calling app
      description: >-
        For apps only: stores or replaces the calling app's own document with
        this key, and its sections, in one transaction. The source app is taken
        from the verified identity of the caller, never from the arguments, so
        an app can only replace its own content. path is the path inside the
        calling app for the link back (for example /pages/<id>). updatedAt is
        the state in the source app; an older state than the stored one is
        ignored (status "stale"). A human or agent caller gets 400 and should
        use documents.add.
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertInput' }
      responses:
        '200':
          description: Stored, replaced or kept because the stored state is newer
          content:
            application/json:
              schema:
                type: object
                required: [id, key, status, chunkCount]
                properties:
                  id: { type: string, format: uuid }
                  key: { type: string }
                  status: { type: string, enum: [created, updated, stale] }
                  chunkCount: { type: integer, minimum: 0 }
        '400': { description: The arguments do not match the tool, or the caller is not an app }
        '401': { description: Not a valid call through the platform }
  /tools/documents.remove:
    post:
      operationId: removeDocument
      summary: Remove content of the calling app
      description: >-
        For apps only: removes the calling app's own document with this key,
        and its sections, for good. The source app is taken from the verified
        identity of the caller, so an app can only remove its own content.
        Idempotent: removed is false if there was nothing to remove.
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              additionalProperties: false
              properties:
                key: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9._:/-]+$' }
      responses:
        '200':
          description: Removed, or nothing to remove
          content:
            application/json:
              schema:
                type: object
                required: [key, removed]
                properties:
                  key: { type: string }
                  removed: { type: boolean }
        '400': { description: The arguments do not match the tool, or the caller is not an app }
        '401': { description: Not a valid call through the platform }
  /tools/embeddings.status:
    post:
      operationId: embeddingsStatus
      summary: Show the state of the embeddings
      description: >-
        Whether search is hybrid or full text only for the caller, which
        embedding model is used, how many visible sections are embedded,
        withheld or pending, how many vectors of an old model still wait to be
        removed, the last error, and the backfill progress. The backfill only
        takes a share of the daily token limit (dailyShare) and continues the
        next UTC day by itself; pausedUntil says until when it waits.
      x-openapps-verb: read
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: State of the embeddings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingStatus' }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
  /tools/embeddings.backfill:
    post:
      operationId: backfillEmbeddings
      summary: Embed pending sections now
      description: >-
        Embeds pending sections, as many as fit into about 20 seconds and into
        today's share of the token limit; the rest follows in the background.
        Retries sections that were withheld before and lifts a pause caused by
        an error, never the pause of the daily share. The token limit itself
        is set by the operator, not here.
      x-openapps-verb: write
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: What this run did, and the state afterwards
          content:
            application/json:
              schema:
                type: object
                required: [retriedWithheld, embedded, withheld, pending, removedOld, stopped, status]
                properties:
                  retriedWithheld: { type: integer }
                  embedded: { type: integer }
                  withheld: { type: integer }
                  pending: { type: integer }
                  removedOld: { type: integer }
                  stopped: { type: [string, 'null'], description: Why the run stopped early }
                  status: { $ref: '#/components/schemas/EmbeddingStatus' }
        '400': { description: The arguments do not match the tool }
        '401': { description: Not a valid call through the platform }
components:
  schemas:
    SearchInput:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
          description: Question or keywords
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Maximum number of passages
    Passage:
      type: object
      required:
        [chunkId, documentId, documentTitle, source, sourceApp, sourcePath, sourceUrl, ord, score, excerpt, text]
      properties:
        chunkId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        source: { type: [string, 'null'], description: Origin of the document, e.g. a URL }
        sourceApp: { type: [string, 'null'], description: App the content comes from; null if stored in Knowledge }
        sourcePath: { type: [string, 'null'], description: Path inside the source app }
        sourceUrl: { type: [string, 'null'], format: uri, description: Link back to the source }
        ord: { type: integer, minimum: 0, description: Position of the section in the document }
        score: { type: number, description: Rank, only comparable within one response }
        excerpt: { type: string, description: Excerpt, matches marked with « and » }
        text: { type: string, description: Full text of the section }
    Citation:
      type: object
      required: [chunkId, documentId, documentTitle, ord, source, sourceApp, sourcePath, sourceUrl]
      properties:
        chunkId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        ord: { type: integer, minimum: 0 }
        source: { type: [string, 'null'] }
        sourceApp: { type: [string, 'null'] }
        sourcePath: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'], format: uri }
    EmbeddingStatus:
      type: object
      required: [configured, model, search, coverage, oldVectors, backfill, lastRunAt, lastError, lastErrorAt, note]
      properties:
        configured: { type: boolean }
        model:
          type: [object, 'null']
          properties:
            provider: { type: string }
            model: { type: string }
            dimensions: { type: [integer, 'null'] }
            local: { type: boolean }
            since: { type: [string, 'null'], format: date-time }
        search: { type: string, enum: [hybrid, fulltext] }
        coverage:
          type: [object, 'null']
          properties:
            sections: { type: integer }
            embedded: { type: integer }
            withheld: { type: integer }
            pending: { type: integer }
        oldVectors: { type: integer }
        backfill:
          type: object
          properties:
            dailyShare: { type: number }
            allowanceToday: { type: [integer, 'null'] }
            pendingTokens: { type: integer }
            estimatedDays: { type: [integer, 'null'] }
            pausedUntil: { type: [string, 'null'], format: date-time }
            pausedReason: { type: [string, 'null'] }
        lastRunAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        lastErrorAt: { type: [string, 'null'], format: date-time }
        note: { type: string }
    DocumentInput:
      type: object
      required: [title, content]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 200000 }
        source: { type: string, maxLength: 500 }
    UpsertInput:
      type: object
      required: [key, title, content]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9._:/-]+$'
          description: Key of the content in the calling app, e.g. a page id
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 200000 }
        source: { type: [string, 'null'], maxLength: 500, description: Readable origin shown with hits, e.g. the page path }
        path:
          type: [string, 'null']
          maxLength: 500
          description: Path inside the calling app for the link back, starting with /
        updatedAt: { type: [string, 'null'], format: date-time, description: State in the source app }
    DocumentSummary:
      type: object
      required:
        [id, title, source, sourceApp, sourceKey, sourcePath, sourceUrl, charCount, chunkCount, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        source: { type: [string, 'null'] }
        sourceApp: { type: [string, 'null'] }
        sourceKey: { type: [string, 'null'] }
        sourcePath: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'], format: uri }
        charCount: { type: integer }
        chunkCount: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          required: [content]
          properties:
            content: { type: string }
    Chunk:
      type: object
      required: [id, ord, text]
      properties:
        id: { type: string, format: uuid }
        ord: { type: integer, minimum: 0 }
        text: { type: string }
