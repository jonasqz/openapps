# Die Wahrheit ueber die Funktionen dieser App.
# Aus dieser Datei erzeugt die Plattform die MCP-Tools. Eine UI-Aktion ohne
# passende Operation hier blockiert das Review-Gate.
#
# Jede Operation ist ein Tool: POST /tools/<toolname> mit den Argumenten als
# JSON-Body (`createToolRoute` aus @openapps/sdk). Der Toolname steht in
# app.json unter offeredTools, mit derselben operationId.
openapi: 3.1.0
info:
  title: Wissen
  version: 0.1.0
  description: >-
    Retrieval-Hälfte eines RAG. Dokumente ablegen, in Abschnitte zerlegen und
    relevante Passagen mit Quelle finden. Die Antwort formuliert der aufrufende
    Agent selbst, aus den gelieferten Passagen und mit Quellenangabe.
servers:
  # Jede App liegt unter einem Pfad auf der gemeinsamen Domain (ADR 0007).
  # `basePath` ist der Pfad, den die Control Plane pro Deployment in
  # OPENAPPS_APP_BASE_PATH setzt und den next.config.js als basePath uebernimmt.
  - url: '{basePath}/api'
    description: Diese App hinter dem Gateway.
    variables:
      basePath:
        default: /wissen
        description: Pfad der App, byte-gleich mit OPENAPPS_APP_BASE_PATH.
paths:
  /tools/search:
    post:
      operationId: search
      summary: Passagen zu einer Frage finden
      description: >-
        Sucht in den internen Dokumenten nach Passagen zu einer Frage oder einem
        Stichwort. Deutsche Volltextsuche: Wortformen werden gefunden
        („Reisen“ findet „Reise“). Anführungszeichen suchen eine Wortfolge,
        ein vorangestelltes Minus schließt ein Wort aus. Findet die genaue
        Anfrage zu wenig, ergänzt die Suche Treffer, die nur einzelne Wörter
        enthalten. Jede Passage kommt mit chunkId, documentId, documentTitle
        und source zurück; excerpt markiert die Treffer mit « und ». Antworte
        nur aus diesen Passagen und nenne zu jeder Aussage die Quelle
        (documentTitle, source und documentId/chunkId). Eine leere Liste heißt:
        Dazu steht nichts in den Dokumenten — dann nicht raten.
      x-openapps-verb: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchInput' }
      responses:
        '200':
          description: Gefundene Passagen, bester Treffer zuerst
          content:
            application/json:
              schema:
                type: object
                required: [passages]
                properties:
                  passages:
                    type: array
                    items: { $ref: '#/components/schemas/Passage' }
        '400': { description: Argumente passen nicht zum Tool }
        '401': { description: Kein gültiger Aufruf über die Plattform }
  /tools/documents.add:
    post:
      operationId: addDocument
      summary: Dokument ablegen
      description: >-
        Legt ein Dokument ab und zerlegt es in einer Transaktion in Abschnitte
        von etwa 800 Zeichen mit etwa 150 Zeichen Überlappung. Danach ist es
        sofort über search auffindbar. content ist Klartext; Absätze durch
        Leerzeilen trennen, dann wird an Absatzgrenzen zerlegt.
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentInput' }
      responses:
        '200':
          description: Abgelegt
          content:
            application/json:
              schema:
                type: object
                required: [id, chunkCount]
                properties:
                  id: { type: string, format: uuid }
                  chunkCount: { type: integer, minimum: 1 }
        '400': { description: Argumente passen nicht zum Tool }
        '401': { description: Kein gültiger Aufruf über die Plattform }
  /tools/documents.list:
    post:
      operationId: listDocuments
      summary: Dokumente auflisten
      description: >-
        Listet die abgelegten Dokumente ohne Volltext, neueste zuerst, höchstens
        200. q filtert nach Titel oder Quelle (Teilwort, ohne Groß- und
        Kleinschreibung). Für inhaltliche Fragen search benutzen.
      x-openapps-verb: read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                q: { type: string, maxLength: 200, description: Filter auf Titel oder Quelle }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }
        '400': { description: Argumente passen nicht zum Tool }
        '401': { description: Kein gültiger Aufruf über die Plattform }
  /tools/documents.get:
    post:
      operationId: getDocument
      summary: Ein Dokument lesen
      description: >-
        Liest ein Dokument mit Volltext. Mit includeChunks true kommen die
        Abschnitte in Reihenfolge dazu. Ein gelöschtes oder unbekanntes
        Dokument ergibt 404.
      x-openapps-verb: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                includeChunks: { type: boolean, default: false }
      responses:
        '200':
          description: Das Dokument
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  chunks:
                    type: array
                    items: { $ref: '#/components/schemas/Chunk' }
        '400': { description: Argumente passen nicht zum Tool }
        '401': { description: Kein gültiger Aufruf über die Plattform }
        '404': { description: Dokument gibt es nicht oder es ist gelöscht }
  /tools/documents.delete:
    post:
      operationId: deleteDocument
      summary: Dokument löschen
      description: >-
        Löscht ein Dokument weich. Es und seine Abschnitte tauchen danach weder
        in search noch in documents.list oder documents.get auf.
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string, format: uuid }
                  deleted: { type: boolean, const: true }
        '400': { description: Argumente passen nicht zum Tool }
        '401': { description: Kein gültiger Aufruf über die Plattform }
        '404': { description: Dokument gibt es nicht oder es ist schon gelöscht }
components:
  schemas:
    SearchInput:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
          description: Frage oder Stichwörter auf Deutsch
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Höchstzahl der Passagen
    Passage:
      type: object
      required: [chunkId, documentId, documentTitle, source, ord, score, excerpt, text]
      properties:
        chunkId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        source: { type: [string, 'null'], description: Herkunft des Dokuments, z. B. URL }
        ord: { type: integer, minimum: 0, description: Position des Abschnitts im Dokument }
        score: { type: number, description: Rang, nur innerhalb einer Antwort vergleichbar }
        excerpt: { type: string, description: Ausschnitt, Treffer in « und » markiert }
        text: { type: string, description: Voller Text des Abschnitts }
    DocumentInput:
      type: object
      required: [title, content]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 200000 }
        source: { type: string, maxLength: 500 }
    DocumentSummary:
      type: object
      required: [id, title, source, charCount, chunkCount, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        source: { type: [string, 'null'] }
        charCount: { type: integer }
        chunkCount: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          required: [content]
          properties:
            content: { type: string }
    Chunk:
      type: object
      required: [id, ord, text]
      properties:
        id: { type: string, format: uuid }
        ord: { type: integer, minimum: 0 }
        text: { type: string }
