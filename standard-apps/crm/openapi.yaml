# Die Wahrheit ueber die Funktionen dieser App.
# Aus dieser Datei erzeugt die Plattform die MCP-Tools. Eine UI-Aktion ohne
# passende Operation hier blockiert das Review-Gate.
#
# Jedes Tool ist `POST /tools/<toolname>` mit den Argumenten als JSON-Body
# (createToolRoute aus @openapps/sdk). Der Name im Pfad ist byte-gleich mit
# `offeredTools[].name` in app.json, die operationId mit
# `offeredTools[].operationId`. src/lib/tools.test.ts haelt beides fest.
openapi: 3.1.0
info:
  title: CRM
  version: 0.1.2
  description: >-
    Lean CRM for humans and agents. Companies, contacts, deals with a
    pipeline, and activities. Amounts are whole euro cents, dates
    YYYY-MM-DD, timestamps ISO 8601. Ids are UUIDs.
servers:
  # Jede App liegt unter einem Pfad auf der gemeinsamen Domain (ADR 0007).
  # `basePath` ist byte-gleich mit OPENAPPS_APP_BASE_PATH.
  - url: '{basePath}/api'
    description: This app behind the gateway.
    variables:
      basePath:
        default: /crm
        description: Path of the app, byte-identical to OPENAPPS_APP_BASE_PATH.
paths:
  /tools/companies.list:
    post:
      operationId: listCompanies
      summary: List companies, optionally with a free-text search
      x-openapps-verb: read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                q: { type: string, maxLength: 200, description: Searches name, industry and website. }
                limit: { $ref: '#/components/schemas/Limit' }
      responses:
        '200':
          description: Companies, alphabetical
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies:
                    type: array
                    items: { $ref: '#/components/schemas/CompanyListItem' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tools/companies.get:
    post:
      operationId: getCompany
      summary: A company with its contacts, deals and latest activities
      x-openapps-verb: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdArgs' }
      responses:
        '200':
          description: The company with everything that belongs to it
          content:
            application/json:
              schema:
                type: object
                required: [company, contacts, deals, activities]
                properties:
                  company: { $ref: '#/components/schemas/Company' }
                  contacts:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
                  deals:
                    type: array
                    items: { $ref: '#/components/schemas/Deal' }
                  activities:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tools/companies.create:
    post:
      operationId: createCompany
      summary: Create a company
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                website: { type: string, maxLength: 500, description: 'http(s) address; https:// is added if no scheme is given.' }
                industry: { type: string, maxLength: 100 }
                notes: { type: string, maxLength: 5000 }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [company]
                properties:
                  company: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tools/contacts.list:
    post:
      operationId: listContacts
      summary: List contacts, optionally with a search and a company filter
      x-openapps-verb: read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                q: { type: string, maxLength: 200, description: Searches name, email, phone and role. }
                companyId: { type: string, format: uuid }
                limit: { $ref: '#/components/schemas/Limit' }
      responses:
        '200':
          description: Contacts, alphabetical
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tools/contacts.get:
    post:
      operationId: getContact
      summary: A contact with its deals and latest activities
      x-openapps-verb: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdArgs' }
      responses:
        '200':
          description: The contact
          content:
            application/json:
              schema:
                type: object
                required: [contact, deals, activities]
                properties:
                  contact: { $ref: '#/components/schemas/Contact' }
                  deals:
                    type: array
                    items: { $ref: '#/components/schemas/Deal' }
                  activities:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tools/contacts.create:
    post:
      operationId: createContact
      summary: Create a contact
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email, maxLength: 254, description: Unique, case-insensitive. }
                phone: { type: string, maxLength: 50 }
                role: { type: string, maxLength: 100 }
                companyId: { type: string, format: uuid }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tools/contacts.update:
    post:
      operationId: updateContact
      summary: Update a contact
      description: Only the fields you pass change. null or empty text clears email, phone, role, companyId.
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              minProperties: 2
              properties:
                id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: [string, 'null'], format: email, maxLength: 254 }
                phone: { type: [string, 'null'], maxLength: 50 }
                role: { type: [string, 'null'], maxLength: 100 }
                companyId: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tools/deals.list:
    post:
      operationId: listDeals
      summary: List deals, optionally by stage and company
      x-openapps-verb: read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                stage: { $ref: '#/components/schemas/Stage' }
                companyId: { type: string, format: uuid }
                limit: { $ref: '#/components/schemas/Limit' }
      responses:
        '200':
          description: Deals, by expected close date
          content:
            application/json:
              schema:
                type: object
                required: [deals]
                properties:
                  deals:
                    type: array
                    items: { $ref: '#/components/schemas/Deal' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tools/deals.create:
    post:
      operationId: createDeal
      summary: Create a deal
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, companyId, valueCents]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                companyId: { type: string, format: uuid }
                contactId: { type: string, format: uuid, description: Must belong to the company. }
                valueCents: { $ref: '#/components/schemas/Cents' }
                stage: { $ref: '#/components/schemas/Stage' }
                expectedClose: { type: string, format: date }
                owner: { type: string, maxLength: 200, description: Defaults to the caller. }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [deal]
                properties:
                  deal: { $ref: '#/components/schemas/Deal' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tools/deals.update_stage:
    post:
      operationId: updateDealStage
      summary: Set the stage of a deal, with an automatic activity
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, stage]
              properties:
                id: { type: string, format: uuid }
                stage: { $ref: '#/components/schemas/Stage' }
                note: { type: string, maxLength: 2000, description: The reason; goes into the body of the activity. }
      responses:
        '200':
          description: >-
            Stage set. changed is false and activity is null if the deal
            already had that stage.
          content:
            application/json:
              schema:
                type: object
                required: [deal, changed, activity]
                properties:
                  deal: { $ref: '#/components/schemas/Deal' }
                  changed: { type: boolean }
                  activity:
                    oneOf:
                      - { $ref: '#/components/schemas/Activity' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tools/activities.log:
    post:
      operationId: logActivity
      summary: Log an activity
      x-openapps-verb: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, subject]
              anyOf:
                - required: [contactId]
                - required: [companyId]
                - required: [dealId]
              properties:
                kind: { $ref: '#/components/schemas/ActivityKind' }
                subject: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, maxLength: 10000 }
                contactId: { type: string, format: uuid }
                companyId: { type: string, format: uuid, description: If missing, it is taken from the deal or contact. }
                dealId: { type: string, format: uuid }
                happenedAt: { type: string, format: date-time, description: Defaults to now. }
      responses:
        '200':
          description: Logged
          content:
            application/json:
              schema:
                type: object
                required: [activity]
                properties:
                  activity: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tools/activities.list:
    post:
      operationId: listActivities
      summary: List activities, newest first
      x-openapps-verb: read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                contactId: { type: string, format: uuid }
                companyId: { type: string, format: uuid, description: Also finds activities on the company's contacts and deals. }
                dealId: { type: string, format: uuid }
                limit: { $ref: '#/components/schemas/Limit' }
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                properties:
                  activities:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tools/pipeline.summary:
    post:
      operationId: getPipelineSummary
      summary: Count, total and weighted total per stage
      description: >-
        Weighting lead 10 %, qualified 25 %, proposal 60 %, won 100 %,
        lost 0 %. weightedOpenCents counts only open stages.
      x-openapps-verb: read
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [stages, totals]
                properties:
                  stages:
                    type: array
                    items:
                      type: object
                      required: [stage, count, sumCents, probability, weightedCents]
                      properties:
                        stage: { $ref: '#/components/schemas/Stage' }
                        count: { type: integer, minimum: 0 }
                        sumCents: { $ref: '#/components/schemas/Cents' }
                        probability: { type: integer, minimum: 0, maximum: 100 }
                        weightedCents: { $ref: '#/components/schemas/Cents' }
                  totals:
                    type: object
                    required: [count, openCount, openSumCents, weightedOpenCents, wonCents, lostCents]
                    properties:
                      count: { type: integer, minimum: 0 }
                      openCount: { type: integer, minimum: 0 }
                      openSumCents: { $ref: '#/components/schemas/Cents' }
                      weightedOpenCents: { $ref: '#/components/schemas/Cents' }
                      wonCents: { $ref: '#/components/schemas/Cents' }
                      lostCents: { $ref: '#/components/schemas/Cents' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  responses:
    Invalid:
      description: The arguments do not fit the tool. message and issues say which field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not a valid call through the platform (signature missing or wrong).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No record with this id exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [invalid, unauthorized, not_found, unknown_tool, internal] }
        message: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              path: { type: array, items: { type: [string, integer] } }
              message: { type: string }
    IdArgs:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    Limit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
    Cents:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Amount in whole euro cents. €12,500.00 = 1250000.
    Stage:
      type: string
      description: >-
        Deal stage. lead, qualified and proposal are open; won and lost are
        closed.
      enum: [lead, qualified, proposal, won, lost]
    ActivityKind:
      type: string
      description: >-
        Activity kind. Stage changes are logged as note.
      enum: [note, call, email, meeting]
    Company:
      type: object
      required: [id, name, website, industry, notes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        website: { type: [string, 'null'] }
        industry: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanyListItem:
      allOf:
        - { $ref: '#/components/schemas/Company' }
        - type: object
          required: [contactCount, openDealCount]
          properties:
            contactCount: { type: integer, minimum: 0 }
            openDealCount: { type: integer, minimum: 0 }
    Contact:
      type: object
      required: [id, name, email, phone, role, companyId, companyName, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        role: { type: [string, 'null'] }
        companyId: { type: [string, 'null'], format: uuid }
        companyName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Deal:
      type: object
      required: [id, title, companyId, companyName, contactId, contactName, valueCents, stage, expectedClose, owner, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        companyId: { type: string, format: uuid }
        companyName: { type: string }
        contactId: { type: [string, 'null'], format: uuid }
        contactName: { type: [string, 'null'] }
        valueCents: { $ref: '#/components/schemas/Cents' }
        stage: { $ref: '#/components/schemas/Stage' }
        expectedClose: { type: [string, 'null'], format: date }
        owner: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Activity:
      type: object
      required: [id, kind, subject, body, contactId, contactName, companyId, companyName, dealId, dealTitle, happenedAt, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ActivityKind' }
        subject: { type: string }
        body: { type: [string, 'null'] }
        contactId: { type: [string, 'null'], format: uuid }
        contactName: { type: [string, 'null'] }
        companyId: { type: [string, 'null'], format: uuid }
        companyName: { type: [string, 'null'] }
        dealId: { type: [string, 'null'], format: uuid }
        dealTitle: { type: [string, 'null'] }
        happenedAt: { type: string, format: date-time }
        createdBy: { type: string, description: 'User id from the gateway; for agents agent:<name>.' }
        createdAt: { type: string, format: date-time }
