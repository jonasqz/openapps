# Die ganze Plattform auf dem eigenen Rechner — ohne Coolify, ohne GitHub,
# mit drei Standard-Apps (wiki, crm, wissen). Anleitung: infra/lokal/README.md.
#
#   ./infra/lokal/einrichten.sh     # .env mit Zufalls-Secrets, Zertifikat
#   docker compose -f infra/lokal/docker-compose.yml up -d --build
#   ./infra/lokal/apps-ausrollen.sh # Apps anlegen, deployen, Agents einrichten
#
# Was gleich ist wie auf dem Server (infra/betrieb): Control Plane, Postgres,
# Deny-Backend und Traefik mit Coolifys Kommandozeile; die Control Plane
# schreibt openapps.yaml selbst; jede App bekommt Schema, Rolle und Env von der
# Control Plane und laeuft erst nach dem Review-Gate. Was anders ist: Das
# Deploy-Backend ist `OPENAPPS_BACKEND=lokal` (ADR 0011).

name: openapps-lokal

x-app: &app
  build:
    context: ../..
    dockerfile: infra/lokal/app.Dockerfile
  restart: unless-stopped
  depends_on:
    init:
      condition: service_completed_successfully
  volumes:
    - lokal-run:/lokal/run:ro
  # Kein `ports:` und keine `traefik.*`-Labels — erreichbar nur ueber den
  # Router, den die Control Plane schreibt.

services:
  # Legt die gemeinsamen Volumes fuer UID 9999 an (wie Coolify /data/coolify).
  init:
    image: busybox:1.36
    command: ['sh', '-c', 'chown 9999:0 /lokal/run /traefik/dynamic && chmod 0750 /lokal/run']
    volumes:
      - lokal-run:/lokal/run
      - traefik-dynamic:/traefik/dynamic

  postgres:
    build:
      context: ../..
      dockerfile: infra/betrieb/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: postgres
      OPENAPPS_OWNER_PASSWORD: ${OPENAPPS_OWNER_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      plattform:
        aliases: [openapps-postgres]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d openapps']
      interval: 3s
      timeout: 3s
      retries: 40

  control-plane:
    build:
      context: ../..
      dockerfile: apps/control-plane/Dockerfile
    image: openapps-lokal-control-plane
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      OPENAPPS_BACKEND: lokal
      LOKAL_RUNTIME_DIR: /lokal/run
      LOKAL_SOURCE_DIR: /lokal/quellen

      DATABASE_URL: postgres://openapps_owner:${OPENAPPS_OWNER_PASSWORD:?}@openapps-postgres:5432/openapps
      APP_DATABASE_HOST: openapps-postgres:5432/openapps
      APPS_DOMAIN: apps.local.test
      CONTROL_PLANE_HOST: cp.local.test
      CONTROL_PLANE_SERVICE_URL: http://openapps-control-plane:3000
      FORWARD_AUTH_ADDRESS: http://openapps-control-plane:3000/api/authz/forward
      GATEWAY_DENY_BACKEND_URL: http://openapps-deny-backend:8080
      GATEWAY_DYNAMIC_DIR: /traefik/dynamic
      GATEWAY_DOCKER_NETWORK: openapps-lokal
      GATEWAY_ENTRYPOINT: https
      # Leer: kein Let's Encrypt, Traefik nimmt das Standard-Zertifikat aus
      # traefik/tls.yml.
      GATEWAY_CERT_RESOLVER: ''
      TRAEFIK_API_URL: http://openapps-traefik:8080

      OPENAPPS_AUTH_MASTER_SECRET: ${OPENAPPS_AUTH_MASTER_SECRET:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://cp.local.test:8443
      # Ohne eigene Google-Zugangsdaten gibt es lokal keinen Login fuer
      # Menschen; Agents brauchen keinen (Bearer-Token am MCP).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-lokal-ohne-google}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-lokal-ohne-google}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-example.com}
      AUTH_BOOTSTRAP_ADMINS: ${AUTH_BOOTSTRAP_ADMINS:-admin@example.com}
    volumes:
      - lokal-run:/lokal/run
      - ../../standard-apps:/lokal/quellen:ro
      - traefik-dynamic:/traefik/dynamic
    networks:
      plattform:
        aliases: [openapps-control-plane]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

  # Oberflaechen der Apps ansehen, ohne Google-Login (ADR 0013). Nur mit
  # `--profile ansehen`, nur am Loopback, nur mit OPENAPPS_BACKEND=lokal.
  # Signiert jede Anfrage als `ansicht@local.test` und umgeht damit die
  # Forward-Auth — gehoert deshalb nie auf einen Server.
  ansehen:
    image: openapps-lokal-control-plane
    profiles: [ansehen]
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    command: ['node_modules/.bin/tsx', 'src/infra/lokal-ansehen.ts']
    environment:
      OPENAPPS_BACKEND: lokal
      DATABASE_URL: postgres://openapps_owner:${OPENAPPS_OWNER_PASSWORD:?}@openapps-postgres:5432/openapps
      OPENAPPS_AUTH_MASTER_SECRET: ${OPENAPPS_AUTH_MASTER_SECRET:?}
    ports:
      - '127.0.0.1:8090:8090'
    networks: [plattform]

  deny-backend:
    build:
      context: ../..
      dockerfile: infra/betrieb/deny-backend/Dockerfile
    restart: unless-stopped
    networks:
      plattform:
        aliases: [openapps-deny-backend]

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      # Coolifys statische Konfiguration nachgebildet (wie infra/traefik).
      - '--entryPoints.http.address=:80'
      - '--entryPoints.https.address=:443'
      - '--providers.file.directory=/traefik/dynamic'
      - '--providers.file.watch=true'
      - '--api.dashboard=false'
      - '--api.insecure=true'
      - '--ping=true'
      - '--accesslog=true'
      - '--accesslog.fields.headers.defaultMode=drop'
    ports:
      # Nur auf dem Loopback des Macs.
      - '127.0.0.1:8443:443'
      - '127.0.0.1:8080:80'
    volumes:
      - traefik-dynamic:/traefik/dynamic
      - ./traefik/lokal-mcp.yml:/traefik/dynamic/lokal-mcp.yml:ro
      - ./traefik/tls.yml:/traefik/dynamic/lokal-tls.yml:ro
      - ./certs:/etc/traefik/local-certs:ro
    networks:
      plattform:
        aliases: [openapps-traefik]

  wiki:
    <<: *app
    environment: { LOKAL_APP: wiki }
    networks:
      plattform:
        aliases: [openapps-wiki]

  crm:
    <<: *app
    environment: { LOKAL_APP: crm }
    networks:
      plattform:
        aliases: [openapps-crm]

  wissen:
    <<: *app
    environment: { LOKAL_APP: wissen }
    networks:
      plattform:
        aliases: [openapps-wissen]

networks:
  plattform:
    name: openapps-lokal

volumes:
  postgres:
  lokal-run:
  traefik-dynamic:
