# Der Catch-all-Router (Spec 1.2, letzter Absatz).
#
# Zweck: Eine Domain, die auf das Gateway zeigt, aber keinen eigenen Router
# hat, darf nicht in Traefiks 404 laufen, sondern in ein klares Nein. Das ist
# der Coolify-Update-Fall: Verschwinden die Labels einer App, verschwindet ihr
# Router — und dann greift dieser hier.

http:
  routers:
    openapps-catch-all:
      # Passt auf jeden Host. In Traefik v3 ist `HostRegexp` ein Go-Regexp auf
      # den Hostnamen.
      rule: 'HostRegexp(`^.+$`)'
      # SICHERHEITSRELEVANT: `priority: 1` ist die kleinste moegliche
      # Prioritaet. Jeder echte App-Router hat ohne eigene Angabe eine
      # Prioritaet in der Laenge seiner Regel (eine `Host(...)`-Regel liegt
      # weit darueber) und gewinnt damit immer. Dieser Router greift nur, wenn
      # kein anderer passt. Wer hier eine hoehere Zahl eintraegt, schaltet
      # jede App ab.
      priority: 1
      entryPoints:
        - websecure
      service: openapps-deny
      # Ohne `certResolver`: fuer eine nicht freigegebene Domain soll kein
      # Zertifikat beantragt werden. Traefik nimmt das Standard-Zertifikat;
      # der Client sieht eine TLS-Warnung und danach 403. Beides richtig.
      tls: {}
      # Keine eigenen Middlewares: die Entrypoint-Kette (strip, forward-auth)
      # laeuft auch hier. Eine unbekannte Domain wird also zuerst von der
      # Control Plane abgelehnt (Schritt 1 der Pruefkette) und erst, wenn die
      # Control Plane sie durchlaesst, vom Deny-Backend. Zwei Schichten, die
      # unabhaengig voneinander Nein sagen.

  services:
    openapps-deny:
      loadBalancer:
        servers:
          - url: 'http://deny-backend:8080'
        # Kein Passhost-Spiel, keine Sticky-Sessions: dieser Dienst kennt
        # nur eine Antwort.
        passHostHeader: false
