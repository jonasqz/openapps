# Die zwei Middlewares, die am Entrypoint `websecure` haengen
# (siehe `../traefik.yml`, Abschnitt 1). Reihenfolge dort: strip, dann auth.
#
# Sie liegen im File-Provider und nicht an Container-Labels, weil ein
# Container einen `@file`-Namen nicht ueberschreiben kann. Ein Coolify-Update,
# das Labels neu schreibt, erreicht diese Datei nicht.

http:
  middlewares:
    # --- 1. Eingehende Identitaets-Header loeschen --------------------------
    # ADR 0004 nennt genau diesen Schritt als den Punkt, an dem das ganze
    # Modell wertlos wird, wenn er fehlt: wer `X-Auth-User-Id: admin` selbst
    # mitschickt, waere sonst Admin. Ein leerer Wert in `customRequestHeaders`
    # loescht den Header aus der Anfrage.
    #
    # Alle fuenf Namen aus Spec 3.1 stehen hier. Die Liste ist bewusst
    # vollstaendig und nicht „die wichtigen": ein nicht geloeschter
    # `X-Auth-Issued-At` reicht, um das 60-Sekunden-Fenster aufzuweiten.
    openapps-strip-auth-headers:
      headers:
        customRequestHeaders:
          X-Auth-User-Id: ''
          X-Auth-User-Email: ''
          X-Auth-Groups: ''
          X-Auth-Issued-At: ''
          X-Auth-Signature: ''

    # --- 2. Die Forward-Auth ------------------------------------------------
    openapps-forward-auth:
      forwardAuth:
        # Nicht direkt die Control Plane, sondern der interne
        # `authz`-Entrypoint von Traefik selbst (siehe `../traefik.yml`).
        # Grund: `forwardAuth` hat keine Timeout-Option, ein Traefik-Dienst
        # schon. Der Weg nach innen fuehrt deshalb einmal durch Traefik
        # zurueck und von dort mit 2-s-Transport zur Control Plane.
        # Und nicht ueber die oeffentliche Domain der Control Plane: sonst
        # liefe die Auth-Pruefung durch die Auth-Pruefung.
        address: 'http://127.0.0.1:8090/api/authz/forward'

        # Genau die fuenf Header aus Spec 3.1 — nicht mehr. Traefik kopiert
        # nur diese aus der Antwort der Control Plane in die Anfrage an die
        # App. Alles andere, was die Control Plane zurueckgibt, bleibt liegen.
        authResponseHeaders:
          - X-Auth-User-Id
          - X-Auth-User-Email
          - X-Auth-Groups
          - X-Auth-Issued-At
          - X-Auth-Signature

        # Die Control Plane entscheidet anhand von `X-Forwarded-Host`,
        # `X-Forwarded-Uri` und `X-Forwarded-Method`. Dass diese Werte von
        # Traefik stammen und nicht vom Aufrufer, haengt daran, dass am
        # Entrypoint kein `forwardedHeaders.insecure` gesetzt ist (Kommentar
        # in `../traefik.yml`). Ohne diese Bedingung ist `true` hier ein Loch.
        trustForwardHeader: true

        # Der Body der Anfrage geht nicht an die Auth. Sie entscheidet ueber
        # Host, Pfad und Session, nicht ueber Nutzdaten.
        forwardBody: false

        # Hier steht absichtlich **keine** Option, die einen Fehlschlag
        # durchlaesst — es gibt in Traefik keine, und es wird keine gesucht
        # (Spec Abschnitt 2: „Es gibt keine Option, die das aufweicht, und es
        # wird keine gesetzt"). Antwortet die Control Plane nicht, nicht mit
        # 2xx oder zu langsam, bricht Traefik die Anfrage ab. Kein
        # `fail open`, kein Cache, kein Not-Schalter.
        #
        # Das Timeout steht nicht hier, weil es hier nicht stehen kann:
        # `forwardAuth` hat in Traefik v3 keine Timeout-Option, und der
        # Standard-`serversTransport` gilt fuer die Middleware nicht
        # (gemessen, Nachweis Fall 8). Es steht am Dienst hinter dem
        # `authz`-Entrypoint, `dynamic/control-plane.yml`.
