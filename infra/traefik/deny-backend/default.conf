# Das Deny-Backend: antwortet auf jede Anfrage, jeden Pfad und jede Methode
# mit 403 und kann sonst nichts.
#
# Warum nginx und nicht Traefiks `errors`-Middleware: Die `errors`-Middleware
# braucht ohnehin einen Dienst, der die Fehlerseite liefert — damit waere
# nichts gespart, aber eine Abhaengigkeit mehr in der Kette. Drei Zeilen
# nginx-Konfiguration auf einem Standard-Image bleiben die kleinste Fassung,
# die ohne eigenen Code auskommt und auch dann noch Nein sagt, wenn Control
# Plane und Datenbank aus sind.

server {
  listen 8080 default_server;
  server_name _;

  # Keine Nutzdaten im Log. Die Anfrage kommt von einer Domain, die niemand
  # freigegeben hat; ihr Pfad und ihre Header gehen uns nichts an.
  access_log off;
  server_tokens off;

  # Fuer den Betreiber erkennbar, fuer den Aufrufer nicht aufschlussreich.
  add_header X-Openapps-Deny 'catch-all' always;

  default_type text/plain;

  # Gilt fuer jeden Pfad und jede Methode: kein Weiterleiten, kein Proxy,
  # keine Datei. Der Text sagt, dass die Domain nicht freigegeben ist, und
  # verraet nicht, welche Domains oder Apps es gibt.
  return 403 "403 Diese Domain ist nicht freigegeben.\n";
}
